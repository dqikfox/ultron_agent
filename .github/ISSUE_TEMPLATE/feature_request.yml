name: 🚀 Feature Request
description: Suggest a new feature or enhancement for ULTRON Agent
title: '[FEATURE] '
labels: ['enhancement', 'needs-triage']
body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting a new feature! Please provide detailed information to help us understand your idea.

  - type: textarea
    id: feature-summary
    attributes:
      label: 🚀 Feature Summary
      description: A clear and concise description of the feature you'd like to see
    validations:
      required: true

  - type: textarea
    id: problem-statement
    attributes:
      label: 🎯 Problem Statement
      description: What problem does this feature solve? What use case does it address?
    validations:
      required: true

  - type: textarea
    id: proposed-solution
    attributes:
      label: 💡 Proposed Solution
      description: Describe your preferred solution or approach
    validations:
      required: true

  - type: textarea
    id: user-stories
    attributes:
      label: 🔄 User Stories
      description: Describe how users would interact with this feature
      placeholder: |
        - As a [user type], I want to [action] so that [benefit]
        - As a [user type], I want to [action] so that [benefit]

  - type: textarea
    id: ui-ux-considerations
    attributes:
      label: 🎨 UI/UX Considerations (if applicable)
      description: How should this feature be presented to users?

  - type: checkboxes
    id: component-impact
    attributes:
      label: 🔧 Component Impact
      options:
        - label: Agent Core
        - label: Brain/AI Logic
        - label: Voice System
        - label: GUI Interface
        - label: Tools System
        - label: Configuration
        - label: Documentation
        - label: Other

  - type: textarea
    id: technical-considerations
    attributes:
      label: Implementation Approach
      description: Any technical details or implementation ideas

  - type: textarea
    id: acceptance-criteria
    attributes:
      label: 📋 Acceptance Criteria
      description: What defines "done" for this feature?
      placeholder: |
        - [ ] Criterion 1
        - [ ] Criterion 2
        - [ ] Criterion 3

  - type: textarea
    id: alternative-solutions
    attributes:
      label: 🔍 Alternative Solutions
      description: Other approaches you've considered

  - type: textarea
    id: additional-context
    attributes:
      label: 📚 Additional Context
      description: Add any other context, mockups, references, or examples

  - type: textarea
    id: related-issues
    attributes:
      label: 🔗 Related Issues/PRs
      description: Link any related issues or pull requests
      placeholder: |
        - Related to #___
        - Depends on #___
        - Blocks #___

  - type: dropdown
    id: business-value
    attributes:
      label: 📊 Business Value
      options:
        - High (core functionality)
        - Medium (nice to have)
        - Low (convenience feature)
    validations:
      required: true

  - type: dropdown
    id: implementation-effort
    attributes:
      label: Implementation Effort
      options:
        - Small (few hours)
        - Medium (few days)
        - Large (weeks)
        - Extra Large (months)
    validations:
      required: true

  - type: dropdown
    id: breaking-changes
    attributes:
      label: Breaking Changes
      options:
        - No breaking changes
        - Minor breaking changes
        - Major breaking changes
    validations:
      required: true

  - type: checkboxes
    id: checklist
    attributes:
      label: ✅ Checklist
      options:
        - label: I have searched existing issues to avoid duplicates
          required: true
        - label: I have provided a clear problem statement
          required: true
        - label: I have described the proposed solution
          required: true
        - label: I have considered the impact on existing features
        - label: This is not a bug report (use Bug Report template instead)
          required: true