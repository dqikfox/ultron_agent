name: 🔧 Tool Development
description: Request a new tool or report issues with existing tools
title: '[TOOL] '
labels: ['tool', 'enhancement', 'needs-triage']
body:
  - type: markdown
    attributes:
      value: |
        Thanks for your interest in tool development! Please provide details about your tool request.

  - type: checkboxes
    id: tool-request-type
    attributes:
      label: 🔧 Tool Request Type
      options:
        - label: New tool development
        - label: Existing tool improvement
        - label: Tool bug fix
        - label: Tool documentation
    validations:
      required: true

  - type: textarea
    id: tool-purpose
    attributes:
      label: 🎯 Tool Purpose
      description: What should this tool accomplish?
    validations:
      required: true

  - type: textarea
    id: use-cases
    attributes:
      label: 🔄 Use Cases
      description: How would users interact with this tool?
      placeholder: |
        1. User types: `[trigger command]`
        2. Tool performs: `[action]`
        3. Tool returns: `[result]`
    validations:
      required: true

  - type: input
    id: tool-name
    attributes:
      label: Tool Name
      placeholder: e.g., "WebSearchTool", "FileManagerTool"
    validations:
      required: true

  - type: input
    id: trigger-words
    attributes:
      label: Trigger Words
      placeholder: e.g., "search", "find", "web"
    validations:
      required: true

  - type: input
    id: categories
    attributes:
      label: Categories
      placeholder: e.g., "productivity", "information", "automation"

  - type: textarea
    id: external-apis
    attributes:
      label: External APIs
      placeholder: e.g., Google Search API, Weather API

  - type: textarea
    id: dependencies
    attributes:
      label: Dependencies
      placeholder: e.g., requests, beautifulsoup4

  - type: textarea
    id: permissions
    attributes:
      label: Permissions
      placeholder: e.g., file system access, network access

  - type: textarea
    id: input-format
    attributes:
      label: 💻 Input Format
      description: Example of expected input
      placeholder: |
        ```python
        # Example of expected input
        command = "search for python tutorials"
        context = {"user_preferences": {...}}
        ```

  - type: textarea
    id: output-format
    attributes:
      label: Output Format
      description: Example of expected output
      placeholder: |
        ```python
        # Example of expected output
        {
            "success": True,
            "result": "Found 10 Python tutorials...",
            "data": {...}
        }
        ```

  - type: textarea
    id: expected-errors
    attributes:
      label: 🔍 Expected Errors
      description: What errors might occur?
      placeholder: |
        - Network connectivity issues
        - API rate limits
        - Invalid input formats
        - Permission errors

  - type: textarea
    id: fallback-behavior
    attributes:
      label: Fallback Behavior
      description: What should happen when the tool fails?

  - type: checkboxes
    id: testing-requirements
    attributes:
      label: ✅ Testing Requirements
      options:
        - label: Unit tests for tool logic
        - label: Integration tests with agent core
        - label: Error handling tests
        - label: Performance tests (if applicable)

  - type: checkboxes
    id: documentation-needs
    attributes:
      label: 📚 Documentation Needs
      options:
        - label: Tool usage examples
        - label: Configuration instructions
        - label: Troubleshooting guide
        - label: API documentation (if applicable)

  - type: textarea
    id: related-tools
    attributes:
      label: 🔗 Related Tools
      description: Any existing tools that are similar or related

  - type: dropdown
    id: priority
    attributes:
      label: 🎯 Priority
      options:
        - Critical (core functionality)
        - High (important feature)
        - Medium (nice to have)
        - Low (convenience feature)
    validations:
      required: true

  - type: checkboxes
    id: checklist
    attributes:
      label: ✅ Checklist
      options:
        - label: I have searched existing tools to avoid duplicates
          required: true
        - label: I have provided clear specifications
          required: true
        - label: I have considered error handling
          required: true
        - label: I have outlined testing requirements