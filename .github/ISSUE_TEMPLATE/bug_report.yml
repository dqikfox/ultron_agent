name: 🐛 Bug Report
description: Report a bug to help us improve ULTRON Agent
title: '[BUG] '
labels: ['bug', 'needs-triage']
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to fill out this bug report! Please provide as much detail as possible.

  - type: textarea
    id: bug-description
    attributes:
      label: 🐛 Bug Description
      description: A clear and concise description of what the bug is
    validations:
      required: true

  - type: textarea
    id: reproduction-steps
    attributes:
      label: 🔄 Steps to Reproduce
      description: Steps to reproduce the behavior
      placeholder: |
        1. 
        2. 
        3. 
        4. 
    validations:
      required: true

  - type: textarea
    id: expected-behavior
    attributes:
      label: ✅ Expected Behavior
      description: A clear and concise description of what you expected to happen
    validations:
      required: true

  - type: textarea
    id: actual-behavior
    attributes:
      label: ❌ Actual Behavior
      description: A clear and concise description of what actually happened
    validations:
      required: true

  - type: textarea
    id: screenshots-logs
    attributes:
      label: 📸 Screenshots/Logs
      description: If applicable, add screenshots or log files to help explain your problem
      placeholder: |
        ```
        Paste relevant log output here
        ```

  - type: input
    id: os
    attributes:
      label: Operating System
      placeholder: e.g., Windows 11, Ubuntu 22.04, macOS 13.0
    validations:
      required: true

  - type: input
    id: python-version
    attributes:
      label: Python Version
      placeholder: e.g., 3.10.8
    validations:
      required: true

  - type: input
    id: ultron-version
    attributes:
      label: ULTRON Agent Version
      placeholder: e.g., 3.0.1
    validations:
      required: true

  - type: checkboxes
    id: components
    attributes:
      label: Component Information
      options:
        - label: Agent Core
        - label: Brain/AI Logic
        - label: Voice System
        - label: GUI Interface
        - label: Tools System
        - label: Configuration
        - label: Other

  - type: textarea
    id: ai-models
    attributes:
      label: AI Models
      description: List the AI models you're using
      placeholder: |
        Ollama Models: llama2, mistral
        OpenAI Models: gpt-4, gpt-3.5-turbo
        Other Models: ___________

  - type: textarea
    id: configuration
    attributes:
      label: ⚙️ Configuration
      description: Relevant configuration settings (remove sensitive information)
      placeholder: |
        ```json
        {
          "relevant_config": "values_here"
        }
        ```

  - type: textarea
    id: additional-context
    attributes:
      label: 🔍 Additional Context
      description: Add any other context about the problem here

  - type: dropdown
    id: priority
    attributes:
      label: 🚨 Priority
      options:
        - Critical (system crashes, data loss)
        - High (major feature broken)
        - Medium (minor feature issue)
        - Low (cosmetic issue)
    validations:
      required: true

  - type: checkboxes
    id: checklist
    attributes:
      label: ✅ Checklist
      options:
        - label: I have searched existing issues to avoid duplicates
          required: true
        - label: I have provided all requested information
          required: true
        - label: I have removed sensitive information from logs/config
          required: true
        - label: I can reproduce this bug consistently
        - label: This is not a feature request (use Feature Request template instead)
          required: true