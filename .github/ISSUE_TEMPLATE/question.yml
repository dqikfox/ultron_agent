name: ❓ Question
description: Ask a question about ULTRON Agent
title: '[QUESTION] '
labels: ['question', 'needs-triage']
body:
  - type: markdown
    attributes:
      value: |
        Ask your question here! Please provide context to help us give you the best answer.

  - type: textarea
    id: question
    attributes:
      label: ❓ Question
      description: Ask your question clearly and concisely
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: 🎯 Context
      description: What are you trying to accomplish?
    validations:
      required: true

  - type: textarea
    id: what-tried
    attributes:
      label: 🔧 What I've Tried
      description: What have you already attempted?

  - type: checkboxes
    id: research-done
    attributes:
      label: 📚 Research Done
      description: What documentation have you checked?
      options:
        - label: README.md
        - label: CONTRIBUTING.md
        - label: FAQ.md
        - label: Existing Issues
        - label: Discussions
        - label: Other (please specify below)

  - type: input
    id: os
    attributes:
      label: Operating System (if relevant)
      placeholder: e.g., Windows 11, Ubuntu 22.04, macOS 13.0

  - type: input
    id: python-version
    attributes:
      label: Python Version (if relevant)
      placeholder: e.g., 3.10.8

  - type: input
    id: ultron-version
    attributes:
      label: ULTRON Agent Version (if relevant)
      placeholder: e.g., 3.0.1

  - type: checkboxes
    id: answer-type
    attributes:
      label: 💡 Expected Answer Type
      description: What type of answer would be most helpful?
      options:
        - label: Step-by-step instructions
        - label: Code example
        - label: Conceptual explanation
        - label: Link to documentation
        - label: Troubleshooting steps
        - label: Best practices
        - label: Other (please specify below)

  - type: textarea
    id: related-info
    attributes:
      label: 🔗 Related Information
      description: Any relevant links, error messages, or context

  - type: checkboxes
    id: checklist
    attributes:
      label: ✅ Checklist
      options:
        - label: I have searched existing issues and discussions
          required: true
        - label: I have checked the documentation
          required: true
        - label: I have provided sufficient context
          required: true
        - label: This is a question, not a bug report or feature request
          required: true