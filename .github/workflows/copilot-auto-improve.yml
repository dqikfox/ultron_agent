name: Copilot Auto-Improve

on:
  schedule:
    - cron: '0 2 * * *'  # Daily at 2 AM UTC
  workflow_dispatch:    # Manual trigger
  push:
    branches:
      - main
    paths:
      - 'ultron_config.json'

jobs:
  auto-improve:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt 2>/dev/null || true
          pip install aiohttp asyncio

      - name: Install Copilot CLI
        run: |
          which copilot || brew install gh copilot || echo "Copilot CLI setup skipped"

      - name: Authenticate GitHub
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh auth status || gh auth login --with-token <<< "$GITHUB_TOKEN"

      - name: Run improvement cycle - Quality
        id: quality
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true
        run: |
          python << 'EOF'
          import asyncio
          import sys
          from pathlib import Path

          # Add project root to path
          sys.path.insert(0, str(Path.cwd()))

          try:
              from utils.self_prompting_orchestrator import SelfPromptingOrchestrator

              async def run():
                  orchestrator = SelfPromptingOrchestrator()
                  result = await orchestrator.start_improvement_cycle(
                      cycle_name=f"auto_improve_quality_{{}}'${{ github.run_number }}'",
                      goals=[
                          "improve code quality",
                          "add type hints",
                          "reduce code complexity"
                      ],
                      priority="high"
                  )
                  print(f"\n✅ Quality improvement cycle completed:")
                  print(f"  - Total tasks: {result['total_tasks']}")
                  print(f"  - Completed: {result['completed']}")
                  print(f"  - Success rate: {result['success_rate']:.1%}")
                  return result

              result = asyncio.run(run())
              sys.exit(0 if result['completed'] > 0 else 1)
          except Exception as e:
              print(f"❌ Error: {e}")
              import traceback
              traceback.print_exc()
              sys.exit(1)
          EOF

      - name: Run improvement cycle - Performance
        id: performance
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true
        run: |
          python << 'EOF'
          import asyncio
          import sys
          from pathlib import Path

          sys.path.insert(0, str(Path.cwd()))

          try:
              from utils.self_prompting_orchestrator import SelfPromptingOrchestrator

              async def run():
                  orchestrator = SelfPromptingOrchestrator()
                  result = await orchestrator.start_improvement_cycle(
                      cycle_name=f"auto_improve_performance_{{}}'${{ github.run_number }}'",
                      goals=[
                          "optimize performance",
                          "reduce latency",
                          "improve memory efficiency"
                      ],
                      priority="medium"
                  )
                  print(f"\n✅ Performance improvement cycle completed:")
                  print(f"  - Total tasks: {result['total_tasks']}")
                  print(f"  - Completed: {result['completed']}")
                  print(f"  - Success rate: {result['success_rate']:.1%}")
                  return result

              result = asyncio.run(run())
              sys.exit(0 if result['completed'] > 0 else 1)
          except Exception as e:
              print(f"❌ Error: {e}")
              import traceback
              traceback.print_exc()
              sys.exit(1)
          EOF

      - name: Run improvement cycle - Documentation
        id: documentation
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true
        run: |
          python << 'EOF'
          import asyncio
          import sys
          from pathlib import Path

          sys.path.insert(0, str(Path.cwd()))

          try:
              from utils.self_prompting_orchestrator import SelfPromptingOrchestrator

              async def run():
                  orchestrator = SelfPromptingOrchestrator()
                  result = await orchestrator.start_improvement_cycle(
                      cycle_name=f"auto_improve_docs_{{}}'${{ github.run_number }}'",
                      goals=[
                          "improve documentation",
                          "generate API docs",
                          "update examples"
                      ],
                      priority="medium"
                  )
                  print(f"\n✅ Documentation improvement cycle completed:")
                  print(f"  - Total tasks: {result['total_tasks']}")
                  print(f"  - Completed: {result['completed']}")
                  print(f"  - Success rate: {result['success_rate']:.1%}")
                  return result

              result = asyncio.run(run())
              sys.exit(0 if result['completed'] > 0 else 1)
          except Exception as e:
              print(f"❌ Error: {e}")
              import traceback
              traceback.print_exc()
              sys.exit(1)
          EOF

      - name: Run tests
        id: tests
        continue-on-error: true
        run: |
          python -m pytest tests/ -v --tb=short 2>/dev/null || \
          python -m pytest . -k "unit" -v --tb=short 2>/dev/null || \
          echo "No tests found or pytest not configured"

      - name: Check for new PRs
        id: check_prs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PR_COUNT=$(gh pr list --state open --search "created:>$(date -d '1 day ago' +%Y-%m-%d)" --json number | grep -c number || echo 0)
          echo "new_prs=$PR_COUNT" >> $GITHUB_OUTPUT
          echo "✅ Found $PR_COUNT new PRs from improvements"

      - name: Create summary
        run: |
          cat > /tmp/summary.md << 'EOF'
          # Copilot Auto-Improve Report

          **Run**: ${{ github.run_number }}
          **Date**: $(date -u +"%Y-%m-%d %H:%M:%S UTC")
          **Workflow**: ${{ github.workflow }}

          ## Improvement Cycles

          | Cycle | Status | Tasks |
          |-------|--------|-------|
          | Quality | ${{ steps.quality.outcome }} | Analyze code, add types, refactor |
          | Performance | ${{ steps.performance.outcome }} | Optimize, reduce latency, memory |
          | Documentation | ${{ steps.documentation.outcome }} | Update docs, API specs |

          ## Results

          - Tests: ${{ steps.tests.outcome }}
          - New PRs Generated: ${{ steps.check_prs.outputs.new_prs || 0 }}

          ## Next Steps

          - Review generated PRs
          - Merge improvements
          - Deploy changes
          - Monitor metrics

          ---
          Generated by Copilot CLI Auto-Improve workflow
          EOF
          cat /tmp/summary.md

      - name: Post to issue
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const summary = fs.readFileSync('/tmp/summary.md', 'utf8');

            github.rest.issues.createComment({
              issue_number: context.issue.number || 1,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: summary
            }).catch(err => console.log('Comment skipped (no issue context)'));

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: improvement-logs
          path: logs/
          retention-days: 7

      - name: Post workflow status
        if: always()
        run: |
          echo "## 🤖 Copilot Auto-Improve Workflow"
          echo ""
          echo "**Status**: ${{ job.status }}"
          echo "**Run ID**: ${{ github.run_id }}"
          echo "**Commit**: ${{ github.sha }}"
          echo ""
          echo "View details: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
