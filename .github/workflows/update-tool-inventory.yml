name: Update Tool Inventory

on:
  push:
    paths:
      - 'tools/**/*.py'
  pull_request:
    paths:
      - 'tools/**/*.py'
  workflow_dispatch:

jobs:
  update-inventory:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'
      
      - name: Run tool discovery
        run: |
          python3 tools_inventory.py
      
      - name: Check if inventory changed
        id: check_changes
        run: |
          if git diff --exit-code TOOLS_INVENTORY.md > /dev/null 2>&1; then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "changed=true" >> $GITHUB_OUTPUT
          fi
      
      - name: Create PR if inventory changed
        if: steps.check_changes.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v5
        with:
          commit-message: 'chore: auto-update tool inventory'
          title: 'Auto-update: Tool Inventory'
          body: |
            This PR updates the tool inventory with newly discovered tools.
            
            Generated by: Update Tool Inventory workflow
            Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          branch: chore/auto-update-tool-inventory
          delete-branch: true
          labels: 'documentation,automated'

