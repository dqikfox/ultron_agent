name: Ultron Agent CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  security-scan:
    name: Security Scanning
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0  # Full history for secret scanning

    - name: Run secret detection
      uses: trufflesecurity/trufflehog@main
      with:
        path: ./
        base: main
        head: HEAD
        extra_args: --debug --only-verified

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install security tools
      run: |
        python -m pip install --upgrade pip
        pip install safety bandit semgrep

    - name: Run safety check
      run: safety check --json --output safety-report.json
      continue-on-error: true

    - name: Run bandit security linter
      run: bandit -r . -f json -o bandit-report.json
      continue-on-error: true

    - name: Upload security reports
      uses: actions/upload-artifact@v3
      if: always()
      with:
        name: security-reports
        path: |
          safety-report.json
          bandit-report.json

  lint-and-type-check:
    name: Code Quality
    runs-on: ubuntu-latest
    needs: security-scan
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Cache dependencies
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/pyproject.toml') }}
        restore-keys: |
          ${{ runner.os }}-pip-

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]"

    - name: Lint with ruff
      run: ruff check . --output-format=github

    - name: Format check with black
      run: black --check --diff .

    - name: Import sorting check
      run: ruff check --select I .

    - name: Type check with mypy
      run: mypy ultron_agent/ --ignore-missing-imports --show-error-codes

  test:
    name: Test Suite
    runs-on: ${{ matrix.os }}
    needs: lint-and-type-check
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.10', '3.11']

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}

    - name: Cache dependencies
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/pyproject.toml') }}
        restore-keys: |
          ${{ runner.os }}-pip-

    - name: Install system dependencies (Ubuntu)
      if: matrix.os == 'ubuntu-latest'
      run: |
        sudo apt-get update
        sudo apt-get install -y portaudio19-dev python3-pyaudio

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]"

    - name: Run unit tests
      run: pytest tests/ -v --cov=ultron_agent --cov-report=xml --cov-report=term-missing -m "not (integration or network or gui or voice or ai)"

    - name: Run integration tests
      run: pytest tests/ -v -m "integration and not (network or gui or voice or ai)"
      continue-on-error: true

    - name: Upload coverage
      if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.10'
      uses: codecov/codecov-action@v3
      with:
        file: ./coverage.xml
        flags: unittests
        name: codecov-umbrella

  dependency-check:
    name: Dependency Audit
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install audit tools
      run: |
        python -m pip install --upgrade pip
        pip install pip-audit

    - name: Audit dependencies
      run: pip-audit --desc --format=json --output=dependency-audit.json
      continue-on-error: true

    - name: Upload dependency audit
      uses: actions/upload-artifact@v3
      if: always()
      with:
        name: dependency-audit
        path: dependency-audit.json

  build-validation:
    name: Build Validation
    runs-on: ${{ matrix.os }}
    needs: [test, dependency-check]
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop'
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install build dependencies
      run: |
        python -m pip install --upgrade pip
        pip install build

    - name: Build package
      run: python -m build

    - name: Validate build
      run: |
        pip install dist/*.whl
        python -c "import ultron_agent; print('✅ Package import successful')"

    - name: Upload build artifacts
      uses: actions/upload-artifact@v3
      with:
        name: dist-${{ matrix.os }}
        path: dist/

  health-check:
    name: Health Check Validation
    runs-on: ubuntu-latest
    needs: test
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]"

    - name: Test health endpoints
      run: |
        python -c "
        import asyncio
        import sys
        sys.path.insert(0, '.')
        from ultron_agent.health import HealthChecker
        
        async def test_health():
            health = HealthChecker()
            result = await health.check_basic_health()
            print('✅ Health check successful:', result['status'])
            
        asyncio.run(test_health())
        "

  release-preparation:
    name: Release Preparation
    runs-on: ubuntu-latest
    needs: [build-validation, health-check]
    if: github.ref == 'refs/heads/main'
    
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install release tools
      run: |
        python -m pip install --upgrade pip
        pip install twine

    - name: Generate changelog
      run: |
        # Create or update CHANGELOG.md based on commits
        echo "# Changelog" > CHANGELOG.md
        echo "" >> CHANGELOG.md
        echo "## [Unreleased]" >> CHANGELOG.md
        git log --oneline --since="1 month ago" --pretty=format:"- %s" >> CHANGELOG.md

    - name: Create release notes
      if: startsWith(github.ref, 'refs/tags/')
      run: |
        echo "Creating release notes for tag: ${GITHUB_REF#refs/tags/}"
        # Additional release note generation logic here
