name: Security Scan

on:
  schedule:
    # Run security scans daily at 2 AM UTC
    - cron: '0 2 * * *'
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  secret-scanning:
    name: Secret Detection
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Run TruffleHog
      uses: trufflesecurity/trufflehog@main
      with:
        path: ./
        base: main
        head: HEAD
        extra_args: --debug --only-verified

    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install detect-secrets
      run: |
        pip install detect-secrets

    - name: Create secrets baseline
      run: |
        detect-secrets scan --baseline .secrets.baseline || true

    - name: Run secrets audit
      run: |
        detect-secrets audit .secrets.baseline

  vulnerability-scanning:
    name: Vulnerability Assessment
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install security tools
      run: |
        python -m pip install --upgrade pip
        pip install safety bandit pip-audit semgrep

    - name: Safety check
      run: |
        safety check --json --output safety-report.json
      continue-on-error: true

    - name: Bandit security scan
      run: |
        bandit -r . -f json -o bandit-report.json -x tests/,venv/,env/
      continue-on-error: true

    - name: pip-audit
      run: |
        pip-audit --desc --format=json --output=pip-audit-report.json
      continue-on-error: true

    - name: Semgrep scan
      run: |
        semgrep --config=auto --json --output=semgrep-report.json .
      continue-on-error: true

    - name: Upload security reports
      uses: actions/upload-artifact@v3
      if: always()
      with:
        name: security-reports-${{ github.sha }}
        path: |
          safety-report.json
          bandit-report.json
          pip-audit-report.json
          semgrep-report.json

    - name: Security report summary
      run: |
        echo "## Security Scan Results" >> $GITHUB_STEP_SUMMARY
        echo "### Safety Check" >> $GITHUB_STEP_SUMMARY
        if [ -f safety-report.json ]; then
          python -c "
          import json
          try:
              with open('safety-report.json') as f:
                  data = json.load(f)
              if data.get('vulnerabilities'):
                  print('❌ Vulnerabilities found:', len(data['vulnerabilities']))
              else:
                  print('✅ No vulnerabilities found')
          except:
              print('⚠️ Could not parse safety report')
          " >> $GITHUB_STEP_SUMMARY
        fi

  compliance-check:
    name: Compliance Validation
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install compliance tools
      run: |
        pip install licensecheck

    - name: License compliance check
      run: |
        licensecheck --zero

    - name: Check for compliance files
      run: |
        echo "Checking for required compliance files..."
        files=(
          "LICENSE"
          "CHANGELOG.md"
          "SECURITY_ALERT.md"
          "MAINTENANCE_GUIDE.md"
          ".gitignore"
          "pyproject.toml"
        )
        
        for file in "${files[@]}"; do
          if [ -f "$file" ]; then
            echo "✅ $file exists"
          else
            echo "❌ $file missing"
            exit 1
          fi
        done

    - name: Validate pyproject.toml
      run: |
        python -c "
        import tomllib
        with open('pyproject.toml', 'rb') as f:
            data = tomllib.load(f)
        
        required_fields = ['name', 'version', 'description', 'authors']
        for field in required_fields:
            if field not in data.get('project', {}):
                print(f'❌ Missing required field: {field}')
                exit(1)
            else:
                print(f'✅ {field}: {data[\"project\"][field]}')
        "

  security-notification:
    name: Security Notifications
    runs-on: ubuntu-latest
    needs: [secret-scanning, vulnerability-scanning, compliance-check]
    if: failure()
    
    steps:
    - name: Notify security team
      run: |
        echo "🚨 Security scan failed for commit ${{ github.sha }}"
        echo "Please review the security reports and take immediate action."
        echo "Repository: ${{ github.repository }}"
        echo "Branch: ${{ github.ref_name }}"
        echo "Commit: ${{ github.sha }}"