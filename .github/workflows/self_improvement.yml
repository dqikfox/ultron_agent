name: Self-Improvement Checks

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '0 0 * * 0'  # Weekly on Sunday

jobs:
  performance-regression-check:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
      
      - name: Create metrics directory
        run: mkdir -p metrics
      
      - name: Run Benchmark
        id: current_benchmark
        run: |
          python self_improvement.py --benchmark
          
          # Check for regression
          if [ -f metrics/benchmarks.json ]; then
            python - <<'PY'
          import json
          with open('metrics/benchmarks.json') as f:
              history = json.load(f)
          if len(history) >= 2:
              current = history[-1]
              previous = history[-2]
              cpu_increase = current['cpu_usage'] - previous['cpu_usage']
              mem_increase = current['memory_usage'] - previous['memory_usage']
          
              if cpu_increase > 20 or mem_increase > 20:
                  print(f'::warning::Performance regression detected! CPU: {cpu_increase:+.1f}%, Memory: {mem_increase:+.1f}%')
                  exit(1)
          PY
          fi
      
      - name: Upload benchmark results
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: benchmark-results
          path: metrics/benchmarks.json
