name: ULTRON Self-Improvement Cycle
permissions:
  contents: write
  issues: write
  pull-requests: write

on:
  # Run weekly on Monday at 00:00 UTC
  schedule:
    - cron: '0 0 * * 1'
  
  # Allow manual trigger
  workflow_dispatch:
    inputs:
      cycle_type:
        description: 'Type of improvement cycle'
        required: true
        default: 'full'
        type: choice
        options:
          - full
          - benchmark
          - scan
          - report

  # Run on push to specific paths
  push:
    paths:
      - '**.py'
      - 'tools/**'
      - 'gui/**'

jobs:
  self-improvement:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3
        with:
          fetch-depth: 0  # Full history for version detection
      
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
          cache: 'pip'
      
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install psutil requests
      
      - name: Run Performance Benchmark
        id: benchmark
        run: |
          echo "Running performance benchmark..."
          python self_improvement.py --benchmark > benchmark_output.txt
          cat benchmark_output.txt
          
          # Extract metrics for GitHub output
          echo "benchmark_complete=true" >> $GITHUB_OUTPUT
      
      - name: Run Improvement Scan
        id: scan
        run: |
          echo "Scanning for improvements..."
          python self_improvement.py --scan > scan_output.txt
          cat scan_output.txt
          
          # Extract suggestion count from the array currently written by the scanner.
          SUGGESTIONS=$(python -c "
          import json
          with open('metrics/suggestions.json') as f:
              suggestions = json.load(f)
          print(suggestions.get('total_suggestions', len(suggestions)) if isinstance(suggestions, dict) else len(suggestions))
          ")
          echo "suggestion_count=$SUGGESTIONS" >> $GITHUB_OUTPUT
      
      - name: Generate Comprehensive Report
        id: report
        run: |
          echo "Generating comprehensive report..."
          python self_improvement.py --report > improvement_report.txt
          cat improvement_report.txt
      
      - name: Create Issue for High Priority Suggestions
        if: steps.scan.outputs.suggestion_count > 0
        uses: actions/github-script@v6
        with:
          script: |
            const fs = require('fs');
            const suggestions = JSON.parse(fs.readFileSync('metrics/suggestions.json', 'utf8'));
            const highPriority = suggestions.filter(s => ['critical', 'high'].includes(s.priority));
            
            if (highPriority.length > 0) {
              const body = `## 🤖 ULTRON Self-Improvement Suggestions\n\n` +
                `Automated scan found **${highPriority.length}** high-priority improvements.\n\n` +
                `### High Priority Items\n\n` +
                highPriority.slice(0, 10).map((s, i) => 
                  `${i+1}. **[${s.priority.toUpperCase()}]** \`${s.module}\`\n` +
                  `   - ${s.description}\n` +
                  `   - **Action**: ${s.suggested_action}\n` +
                  `   - **Impact**: ${s.estimated_impact}\n` +
                  `   - **Confidence**: ${(s.confidence * 100).toFixed(0)}%\n`
                ).join('\n') +
                `\n\n### Next Steps\n` +
                `- Review suggestions in \`metrics/suggestions.json\`\n` +
                `- Prioritize based on impact and effort\n` +
                `- Implement improvements in feature branch\n` +
                `- Run \`python self_improvement.py --benchmark\` to measure impact\n\n` +
                `*Generated by ULTRON Self-Improvement Framework*`;
              
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: `[ULTRON] Self-Improvement Suggestions - ${new Date().toISOString().split('T')[0]}`,
                body: body,
                labels: ['enhancement', 'automated', 'self-improvement']
              });
            }
      
      - name: Upload Metrics Artifacts
        uses: actions/upload-artifact@v3
        with:
          name: evolution-metrics
          path: |
            metrics/
            benchmark_output.txt
            scan_output.txt
            improvement_report.txt
          retention-days: 90
      
      - name: Commit Metrics (if changed)
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "ULTRON Evolution Bot"
          git add metrics/ EVOLUTION_CHANGELOG.md
          git diff --quiet && git diff --staged --quiet || git commit -m "📊 Auto: Update evolution metrics [skip ci]"
      
      - name: Push Changes
        uses: ad-m/github-push-action@master
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          branch: ${{ github.ref }}
      
      - name: Post Summary
        run: |
          echo "## 🚀 ULTRON Self-Improvement Cycle Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Benchmark Results" >> $GITHUB_STEP_SUMMARY
          cat benchmark_output.txt >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Improvement Scan" >> $GITHUB_STEP_SUMMARY
          cat scan_output.txt >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Artifacts" >> $GITHUB_STEP_SUMMARY
          echo "- Metrics saved to \`metrics/\`" >> $GITHUB_STEP_SUMMARY
          echo "- Full report available in artifacts" >> $GITHUB_STEP_SUMMARY
          echo "- Changelog updated in \`EVOLUTION_CHANGELOG.md\`" >> $GITHUB_STEP_SUMMARY

  performance-regression-check:
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3
      
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install psutil requests
      
      - name: Run Benchmark
        id: current_benchmark
        run: |
          python self_improvement.py --benchmark
          
          # Check for regression
          if [ -f metrics/benchmarks.json ]; then
            python -c "
            import json
            with open('metrics/benchmarks.json') as f:
                history = json.load(f)
            if len(history) >= 2:
                current = history[-1]
                previous = history[-2]
                cpu_increase = current['cpu_usage'] - previous['cpu_usage']
                mem_increase = current['memory_usage'] - previous['memory_usage']
                
                if cpu_increase > 20 or mem_increase > 20:
                    print(f'::warning::Performance regression detected! CPU: {cpu_increase:+.1f}%, Memory: {mem_increase:+.1f}%')
            "
          fi
      
      - name: Comment on PR
        if: github.event_name == 'push' && github.ref != 'refs/heads/main'
        uses: actions/github-script@v6
        with:
          script: |
            const fs = require('fs');
            if (fs.existsSync('metrics/benchmarks.json')) {
              const history = JSON.parse(fs.readFileSync('metrics/benchmarks.json', 'utf8'));
              const current = history[history.length - 1];
              
              const comment = `## ⚡ Performance Check\n\n` +
                `- **CPU Usage**: ${current.cpu_usage.toFixed(1)}%\n` +
                `- **Memory Usage**: ${current.memory_usage.toFixed(1)}%\n` +
                `- **API Latency**: ${current.api_latency.toFixed(1)}ms\n` +
                `- **Tool Count**: ${current.tool_count}\n\n` +
                `*Automated performance check by ULTRON Evolution Framework*`;
              
              // Find related PR
              const prs = await github.rest.pulls.list({
                owner: context.repo.owner,
                repo: context.repo.repo,
                state: 'open',
                head: `${context.repo.owner}:${context.ref.replace('refs/heads/', '')}`
              });
              
              if (prs.data.length > 0) {
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: prs.data[0].number,
                  body: comment
                });
              }
            }
