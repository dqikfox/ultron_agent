[tox]
min_version = 4.11.1
envlist = 
    py{310,311,312}
    lint
    security
    mypy
    coverage

[gh-actions]
python = 
    3.10: py310
    3.11: py311  
    3.12: py312

[testenv]
deps = 
    -e.[dev]
    pytest-xdist
commands = 
    pytest tests/ -n auto --tb=short {posargs}

[testenv:lint]
skip_install = false
deps = 
    ruff
    black
    isort
commands = 
    ruff check . --statistics
    black --check --diff .
    isort --check-only --diff .

[testenv:security]
deps = 
    bandit[toml]
    safety
commands = 
    bandit -r . --skip B101
    safety check --short-report

[testenv:mypy]
deps = 
    mypy
    -e.[dev]
commands = 
    mypy ultron_agent/ --ignore-missing-imports

[testenv:coverage]
deps = 
    coverage[toml]
    pytest-cov
    -e.[dev]
commands = 
    coverage erase
    pytest tests/ --cov=ultron_agent --cov-report=html --cov-report=term-missing
    coverage report --fail-under=70

[testenv:pre-commit]
skip_install = true
deps = pre-commit
commands = pre-commit run --all-files

[testenv:docs]
changedir = docs
deps = 
    sphinx
    sphinx-rtd-theme
    myst-parser
commands = 
    sphinx-build -W -b html . _build/html

# Performance testing environment
[testenv:performance]
deps = 
    pytest-benchmark
    -e.[dev]
commands = 
    pytest tests/ -m performance --benchmark-only

# Integration testing environment  
[testenv:integration]
deps = 
    -e.[dev]
commands = 
    pytest tests/ -m integration -v --tb=long

[testenv:clean]
deps = coverage[toml]
skip_install = true
commands = coverage erase