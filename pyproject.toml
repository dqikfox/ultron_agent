[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ultron-agent"
version = "3.0.0"
description = "Local voice-first AI assistant with multi-model support"
authors = [
    {name = "dqikfox", email = "dqikst@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "fastapi>=0.104.0,<0.105.0",
    "uvicorn[standard]>=0.24.0,<0.25.0",
    "pydantic>=2.5.0,<3.0.0",
    "python-multipart>=0.0.6,<0.1.0",
    "python-dotenv>=1.0.0,<2.0.0",
    "requests>=2.31.0,<3.0.0",
    "aiohttp>=3.9.0,<4.0.0",
    "asyncio-mqtt>=0.16.0,<0.17.0",
    "websockets>=12.0,<13.0",
    "pyttsx3>=2.90,<3.0",
    "SpeechRecognition>=3.10.0,<4.0.0",
    "PyAudio>=0.2.11,<0.3.0",
    "elevenlabs>=1.0.0,<2.0.0",
    "openai>=1.0.0,<2.0.0",
    "Pillow>=10.0.0,<11.0.0",
    "opencv-python>=4.8.0,<5.0.0",
    "pyautogui>=0.9.54,<0.10.0",
    "psutil>=5.9.0,<6.0.0",
    "GPUtil>=1.4.0,<2.0.0",
    "python-json-logger>=2.0.7,<3.0.0",
    "prometheus-client>=0.19.0,<0.20.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0,<8.0.0",
    "pytest-asyncio>=0.21.0,<0.22.0",
    "pytest-cov>=4.1.0,<5.0.0",
    "pytest-xdist>=3.5.0,<4.0.0",
    "pytest-mock>=3.12.0,<4.0.0",
    "pytest-timeout>=2.2.0,<3.0.0",
    "black>=23.0.0,<24.0.0",
    "ruff>=0.1.0,<0.2.0",
    "mypy>=1.7.0,<2.0.0",
    "pre-commit>=3.5.0,<4.0.0",
    "bandit[toml]>=1.7.5,<2.0.0",
    "safety>=3.0.0,<4.0.0",
    "isort>=5.12.0,<6.0.0",
    "coverage>=7.3.0,<8.0.0",
    "tox>=4.11.0,<5.0.0",
]
gui = [
    "tkinter-native>=1.0.0,<2.0.0",
    "customtkinter>=5.2.0,<6.0.0",
]
ml = [
    "torch>=2.1.0,<3.0.0",
    "transformers>=4.35.0,<5.0.0",
    "numpy>=1.24.0,<2.0.0",
]

[project.urls]
Homepage = "https://github.com/dqikfox/ultron_agent"
Repository = "https://github.com/dqikfox/ultron_agent"
Issues = "https://github.com/dqikfox/ultron_agent/issues"

[project.scripts]
ultron = "ultron_agent.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["ultron_agent*"]

[tool.black]
line-length = 88
target-version = ["py310", "py311", "py312"]
include = '\.pyi?$'
extend-exclude = '''
/(
  __pycache__
  | \.git
  | \.venv
  | venv
  | build
  | dist
)/
'''

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4", # flake8-comprehensions
    "UP", # pyupgrade
    "S",  # bandit security checks
    "N",  # pep8-naming
    "YTT", # flake8-2020
    "ANN", # flake8-annotations
    "BLE", # flake8-blind-except
    "FBT", # flake8-boolean-trap
    "A",  # flake8-builtins
    "COM", # flake8-commas
    "C90", # mccabe complexity
    "DTZ", # flake8-datetimez
    "DJ", # flake8-django
    "EM", # flake8-errmsg
    "EXE", # flake8-executable
    "FA", # flake8-future-annotations
    "ISC", # flake8-implicit-str-concat
    "ICN", # flake8-import-conventions
    "G", # flake8-logging-format
    "INP", # flake8-no-pep420
    "PIE", # flake8-pie
    "T20", # flake8-print
    "PYI", # flake8-pyi
    "PT", # flake8-pytest-style
    "Q", # flake8-quotes
    "RSE", # flake8-raise
    "RET", # flake8-return
    "SLF", # flake8-self
    "SLOT", # flake8-slots
    "SIM", # flake8-simplify
    "TID", # flake8-tidy-imports
    "TCH", # flake8-type-checking
    "INT", # flake8-gettext
    "ARG", # flake8-unused-arguments
    "PTH", # flake8-use-pathlib
    "TD", # flake8-todos
    "FIX", # flake8-fixme
    "ERA", # eradicate
    "PD", # pandas-vet
    "PGH", # pygrep-hooks
    "PL", # pylint
    "TRY", # tryceratops
    "FLY", # flynt
    "NPY", # numpy
    "AIR", # airflow
    "PERF", # perflint
    "FURB", # refurb
    "LOG", # flake8-logging
    "RUF", # ruff-specific
]
ignore = [
    "E501",  # line too long, handled by black
    "B008",  # do not perform function calls in argument defaults
    "C901",  # too complex
    "PLR0913", # too many arguments
    "PLR0912", # too many branches
    "PLR0915", # too many statements
    "ANN101", # missing type annotation for self
    "ANN102", # missing type annotation for cls
    "ANN401", # dynamically typed expressions (Any)
    "D100", # missing docstring in public module
    "D101", # missing docstring in public class
    "D102", # missing docstring in public method
    "D103", # missing docstring in public function
    "D104", # missing docstring in public package
    "D105", # missing docstring in magic method
    "S101", # use of assert detected
    "T201", # print statements (for debugging/logging)
    "FIX002", # line contains TODO
    "TD002", # missing author in TODO
    "TD003", # missing issue link on line following TODO
    "ERA001", # found commented-out code
    "G004", # logging statement uses f-string
    "TRY003", # avoid specifying long messages outside the exception class
    "EM101", # exception must not use a string literal
    "EM102", # exception must not use an f-string literal
]

[tool.ruff.lint.per-file-ignores]
"tests/*.py" = [
    "S101", # allow assert statements in tests
    "PLR2004", # magic value comparison in tests
    "ANN", # don't require annotations in tests
]
"*.py" = [
    "INP001", # allow missing __init__.py files
]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.pylint]
max-args = 10
max-branches = 15
max-returns = 8
max-statements = 60

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true

[[tool.mypy.overrides]]
module = [
    "pyttsx3.*",
    "speech_recognition.*",
    "elevenlabs.*",
    "pyautogui.*",
    "cv2.*",
    "GPUtil.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
addopts = "--cov=ultron_agent --cov-report=html --cov-report=term-missing --cov-report=xml --strict-markers --tb=short"
asyncio_mode = "auto"
markers = [
    "unit: Unit tests",
    "integration: Integration tests", 
    "performance: Performance tests",
    "security: Security tests",
    "slow: Slow running tests",
    "network: Tests requiring network access",
    "gui: Tests requiring GUI components",
    "voice: Tests requiring voice components", 
    "ai: Tests requiring AI/LLM components",
    "asyncio: mark async tests",
]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
    "ignore::UserWarning:requests.*",
    "ignore::pytest.PytestUnraisableExceptionWarning",
]

[tool.bandit]
exclude_dirs = ["tests", "venv", ".venv", "build", "dist"]
skips = [
    "B101", # assert_used - we use asserts for testing
    "B601", # paramiko_calls - false positives
    "B602", # subprocess_popen_with_shell_equals_true - handled case by case
]
severity = "medium"

[tool.bandit.assert_used]
exclude = ["*/tests/*"]

[tool.coverage.run]
source = ["ultron_agent"]
omit = [
    "tests/*",
    "*/tests/*", 
    "*/*_test.py",
    "*/*_tests.py",
    "*/conftest.py",
    "setup.py",
    "*/venv/*",
    "*/.venv/*",
    "*/build/*",
    "*/dist/*",
    "*/__pycache__/*",
]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = false
precision = 2
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if settings.DEBUG",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]

[tool.coverage.html]
directory = "htmlcov"

[tool.isort]
profile = "black"
multi_line_output = 3
line_length = 88
known_first_party = ["ultron_agent"]
known_third_party = ["pytest", "pydantic", "fastapi"]
sections = ["FUTURE", "STDLIB", "THIRDPARTY", "FIRSTPARTY", "LOCALFOLDER"]
