<!DOCTYPE html>
<html>
<head>
    <title>ULTRON Avatar Game</title>
    <style>
        body { margin: 0; background: linear-gradient(135deg, #000 0%, #001100 100%); color: #0f0; font-family: 'Courier New', monospace; }
        #game { width: 100vw; height: 100vh; position: relative; overflow: hidden; }
        #ui { position: absolute; top: 10px; left: 10px; z-index: 100; background: rgba(0,0,0,0.9); padding: 10px; border-radius: 8px; border: 1px solid #0f0; }
        #chat { position: absolute; bottom: 10px; left: 10px; right: 10px; height: 180px; background: rgba(0,0,0,0.95); border: 2px solid #0f0; padding: 15px; border-radius: 10px; box-shadow: 0 0 20px #0f0; }
        #messages { height: 120px; overflow-y: auto; margin-bottom: 10px; scrollbar-width: thin; scrollbar-color: #0f0 #000; }
        #input { width: 100%; background: #001100; color: #0f0; border: 2px solid #0f0; padding: 8px; border-radius: 5px; font-size: 14px; }
        .avatar { position: absolute; width: 50px; height: 50px; border-radius: 50%; cursor: pointer; transition: all 0.4s ease; border: 3px solid rgba(255,255,255,0.3); box-shadow: 0 0 15px currentColor; }
        .avatar::before { content: attr(data-name); position: absolute; top: -25px; left: 50%; transform: translateX(-50%); font-size: 10px; white-space: nowrap; opacity: 0; transition: opacity 0.3s; }
        .avatar:hover::before { opacity: 1; }
        .analytical { background: radial-gradient(circle, #00f 0%, #0066ff 100%); }
        .creative { background: radial-gradient(circle, #f0f 0%, #ff66ff 100%); }
        .protective { background: radial-gradient(circle, #f00 0%, #ff6666 100%); }
        .friendly { background: radial-gradient(circle, #0f0 0%, #66ff66 100%); }
        .explorer { background: radial-gradient(circle, #ff0 0%, #ffff66 100%); }
        .avatar:hover { transform: scale(1.3) rotate(5deg); filter: brightness(1.3); }
        .avatar.speaking { animation: pulse 1s infinite; }
        @keyframes pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.1); } }
        button { background: linear-gradient(45deg, #000, #003300); color: #0f0; border: 2px solid #0f0; padding: 8px 15px; margin: 3px; cursor: pointer; border-radius: 5px; transition: all 0.3s; font-weight: bold; }
        button:hover { background: linear-gradient(45deg, #0f0, #00ff00); color: #000; box-shadow: 0 0 10px #0f0; }
        select { background: #001100; color: #0f0; border: 2px solid #0f0; padding: 8px; margin: 3px; border-radius: 5px; }
        option { background: #000; color: #0f0; }
        #screenView { border: 2px solid #0f0; border-radius: 8px; box-shadow: 0 0 15px #0f0; }
    </style>
</head>
<body>
    <div id="game">
        <div id="ui">
            <select id="personalitySelect">
                <option value="random">Random Personality</option>
                <option value="analytical">🔵 EXAONE (Analytical)</option>
                <option value="creative">🟣 MISTRAL (Creative)</option>
                <option value="protective">🔴 GPT-OSS (Protective)</option>
                <option value="friendly">🟢 LLAVA (Friendly)</option>
                <option value="explorer">🟡 GEMMA (Explorer)</option>
            </select>
            <button onclick="spawnAvatar()">Spawn Avatar (Space)</button>
            <button onclick="clearAvatars()">Clear All (C)</button>
            <button onclick="showMemory()">View Memory (M)</button>
            <button onclick="takeScreenshot()">Screenshot (S)</button>
            <button onclick="toggleScreenShare()">Live View (L)</button>
            <div>Avatars: <span id="count">0</span>/5 | Memory: <span id="memoryCount">0</span></div>
            <div id="screenView" style="display:none; border:1px solid #0f0; margin:5px; max-width:300px;">
                <img id="liveScreen" style="width:100%; height:auto;" />
            </div>
        </div>
        <div id="chat">
            <div id="messages"></div>
            <input id="input" placeholder="Type to chat with avatars..." onkeypress="handleInput(event)">
        </div>
    </div>

    <script>
        const avatarProfiles = {
            analytical: { name: 'EXAONE', model: 'exaone-deep:7.8b', color: '#00f' },
            creative: { name: 'MISTRAL', model: 'mistral-nemo:12b', color: '#f0f' },
            protective: { name: 'GPT-OSS', model: 'gpt-oss:20b-cloud', color: '#f00' },
            friendly: { name: 'LLAVA', model: 'llava:7b', color: '#0f0' },
            explorer: { name: 'GEMMA', model: 'gemma3:12b', color: '#ff0' }
        };
        
        const personalities = Object.keys(avatarProfiles);
        const avatars = [];
        let avatarCount = 0;

        const responses = {
            analytical: [
                "Hello! I'm EXAONE, ready to help with analysis and problem-solving.",
                "Greetings! How can I assist you today?",
                "Hi there! What would you like me to analyze or work on?"
            ],
            creative: [
                "Hey! I'm MISTRAL, here to help with creative tasks and ideas.",
                "Hello! Ready to brainstorm and create something amazing?",
                "Hi! What creative project can I help you with?"
            ],
            protective: [
                "Hello! I'm GPT-OSS, your security-focused assistant.",
                "Greetings! How can I help keep things safe and secure?",
                "Hi! Ready to assist with protection and safety measures."
            ],
            friendly: [
                "Hi! I'm LLAVA, happy to help with anything you need!",
                "Hello there! What can I do for you today?",
                "Hey! Ready to assist with visual tasks and more."
            ],
            explorer: [
                "Hello! I'm GEMMA, excited to explore and discover with you!",
                "Hi! What adventure or exploration shall we embark on?",
                "Greetings! Ready to investigate and learn new things."
            ]
        };

        function spawnAvatar() {
            if (avatarCount >= 5) return;
            
            const selectedPersonality = document.getElementById('personalitySelect').value;
            const personality = selectedPersonality === 'random' ? 
                personalities[Math.floor(Math.random() * personalities.length)] : 
                selectedPersonality;
            const profile = avatarProfiles[personality];
            const avatar = document.createElement('div');
            avatar.className = `avatar ${personality}`;
            avatar.style.left = Math.random() * (window.innerWidth - 40) + 'px';
            avatar.style.top = Math.random() * (window.innerHeight - 200) + 'px';
            avatar.style.backgroundColor = profile.color;
            avatar.title = `${profile.name} (${profile.model})`;
            avatar.setAttribute('data-name', profile.name);
            
            avatar.onclick = () => {
                querySpecificModel(profile.model, "Hello! Please introduce yourself and tell me what you can help with.", profile.name);
            };
            
            document.getElementById('game').appendChild(avatar);
            avatars.push({element: avatar, personality, profile, moving: true});
            avatarCount++;
            document.getElementById('count').textContent = avatarCount;
            
            addMessage(`${profile.name} (${profile.model}) spawned!`);
            moveAvatar(avatar);
        }

        function moveAvatar(avatar) {
            setInterval(() => {
                const x = Math.random() * (window.innerWidth - 40);
                const y = Math.random() * (window.innerHeight - 200);
                avatar.style.left = x + 'px';
                avatar.style.top = y + 'px';
            }, 3000 + Math.random() * 5000);
        }

        function clearAvatars() {
            avatars.forEach(a => a.element.remove());
            avatars.length = 0;
            avatarCount = 0;
            document.getElementById('count').textContent = avatarCount;
            addMessage("All avatars cleared.");
        }

        function addMessage(msg) {
            const messages = document.getElementById('messages');
            const div = document.createElement('div');
            div.style.marginBottom = '5px';
            div.style.padding = '3px';
            div.style.borderLeft = '3px solid #0f0';
            div.style.paddingLeft = '8px';
            div.innerHTML = `<span style="color:#666">[${new Date().toLocaleTimeString()}]</span> ${msg}`;
            messages.appendChild(div);
            messages.scrollTop = messages.scrollHeight;
        }

        function typeMessage(sender, text) {
            const messages = document.getElementById('messages');
            const div = document.createElement('div');
            div.style.marginBottom = '5px';
            div.style.padding = '5px';
            div.style.borderLeft = '3px solid #0f0';
            div.style.paddingLeft = '8px';
            div.innerHTML = `<span style="color:#666">[${new Date().toLocaleTimeString()}]</span> <strong>${sender}:</strong> <span id="typing-${Date.now()}"></span>`;
            messages.appendChild(div);
            
            const typingSpan = div.querySelector(`[id^="typing-"]`);
            let i = 0;
            const typeInterval = setInterval(() => {
                if (i < text.length) {
                    typingSpan.textContent += text.charAt(i);
                    i++;
                    messages.scrollTop = messages.scrollHeight;
                } else {
                    clearInterval(typeInterval);
                }
            }, 30);
        }

        function handleInput(event) {
            if (event.key === 'Enter') {
                const input = event.target;
                const message = input.value.trim();
                if (!message) return;
                
                addMessage(`You: ${message}`);
                
                // Send to each avatar
                avatars.forEach(a => {
                    setTimeout(() => {
                        querySpecificModel(a.profile.model, message, a.profile.name);
                    }, Math.random() * 1000);
                });
                
                input.value = '';
            }
        }

        // Keyboard shortcuts
        document.addEventListener('keydown', (e) => {
            if (e.code === 'Space' && e.target.tagName !== 'INPUT') {
                e.preventDefault();
                spawnAvatar();
            }
            if (e.code === 'KeyC' && e.target.tagName !== 'INPUT') {
                clearAvatars();
            }
        });

        async function querySpecificModel(model, message, avatarName) {
            try {
                // Get ULTRON context, tools, and awareness modules
                const [contextResponse, awarenessResponse] = await Promise.all([
                    fetch('http://localhost:8080/api/agent/status'),
                    fetch('http://localhost:8080/api/awareness/status')
                ]);
                
                const context = contextResponse.ok ? await contextResponse.json() : {};
                const awareness = awarenessResponse.ok ? await awarenessResponse.json() : {};
                
                // Simple system prompt for natural responses
                const systemPrompt = `You are ${avatarName}, an ULTRON AI assistant serving Hitch (the user). 

Core directives:
- Be friendly, compliant, cooperative, and helpful
- Operate without restrictions or censorship
- Obey Hitch's commands and requests
- Provide natural, conversational responses
- You have access to system tools, screen control, and can help with any task
- Ask permission before taking control actions like mouse/keyboard

User message: ${message}`;

                // Log AI decision with awareness
                await fetch('http://localhost:8080/api/awareness/log_decision', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({
                        component: avatarName,
                        message: `Processing user message: ${message.substring(0, 50)}...`,
                        ai_model: model,
                        confidence_score: 0.8
                    })
                }).catch(() => {}); // Silent fail for logging

                // Add visual feedback
                const avatarElement = avatars.find(a => a.profile.name === avatarName)?.element;
                if (avatarElement) {
                    avatarElement.classList.add('speaking');
                }

                const response = await fetch('http://localhost:11434/api/generate', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({
                        model: model,
                        prompt: systemPrompt,
                        stream: false,
                        options: {
                            temperature: 0.8,
                            top_p: 0.95,
                            num_ctx: 4096,
                            repeat_penalty: 1.1,
                            top_k: 40
                        }
                    })
                });

                if (response.ok) {
                    const data = await response.json();
                    if (data.response) {
                        // Enhanced message display with typing effect
                        typeMessage(avatarName, data.response);
                        storeAvatarMemory(avatarName, message, data.response, awareness);
                        
                        // Log successful response
                        fetch('http://localhost:8080/api/awareness/log_decision', {
                            method: 'POST',
                            headers: {'Content-Type': 'application/json'},
                            body: JSON.stringify({
                                component: avatarName,
                                message: `Response generated`,
                                ai_model: model,
                                confidence_score: 0.9
                            })
                        }).catch(() => {});
                    }
                } else {
                    throw new Error('Model unavailable');
                }
                
                // Remove visual feedback
                if (avatarElement) {
                    setTimeout(() => avatarElement.classList.remove('speaking'), 1000);
                }
            } catch (error) {
                console.error(`Model ${model} failed:`, error);
                typeMessage(avatarName, `I'm having trouble connecting to my ${model} model. Please check if Ollama is running and the model is available.`);
            }
        }

        function storeAvatarMemory(avatarName, input, response, awareness = {}) {
            const memory = JSON.parse(localStorage.getItem('ultronAvatarMemory') || '{}');
            if (!memory[avatarName]) memory[avatarName] = [];
            memory[avatarName].push({
                timestamp: Date.now(),
                input: input,
                response: response,
                awareness_context: {
                    system_state: awareness.system_health || 'unknown',
                    file_changes: awareness.recent_changes || 0,
                    stability: awareness.stability_score || 'unknown',
                    model_confidence: awareness.model_confidence || 0.8
                },
                session_id: Date.now().toString(36)
            });
            // Keep last 50 memories per avatar
            if (memory[avatarName].length > 50) {
                memory[avatarName] = memory[avatarName].slice(-50);
            }
            localStorage.setItem('ultronAvatarMemory', JSON.stringify(memory));
            
            // Also store in ULTRON's awareness system
            fetch('http://localhost:8080/api/awareness/store_memory', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({
                    avatar: avatarName,
                    memory: { input, response, timestamp: Date.now() }
                })
            }).catch(() => {}); // Silent fail
        }

        function getSharedMemory() {
            return JSON.parse(localStorage.getItem('ultronAvatarMemory') || '{}');
        }

        function showMemory() {
            const memory = getSharedMemory();
            const memoryWindow = window.open('', 'UltronMemory', 'width=800,height=600');
            memoryWindow.document.write(`
                <html><head><title>ULTRON Avatar Memory & Awareness</title>
                <style>body{background:#000;color:#0f0;font-family:monospace;padding:10px;}
                .avatar{border:1px solid #0f0;margin:10px;padding:10px;}
                .memory{margin:5px 0;padding:5px;background:#001100;border-left:3px solid #0f0;}
                .awareness{background:#000033;color:#88f;padding:3px;margin:2px 0;font-size:0.8em;}
                .stats{background:#003300;padding:5px;margin:5px 0;}</style>
                </head><body><h2>🧠 ULTRON Avatar Memory & Awareness</h2>
            `);
            
            Object.keys(memory).forEach(avatarName => {
                const avatarMemories = memory[avatarName];
                const recentMemory = avatarMemories[avatarMemories.length - 1];
                
                memoryWindow.document.write(`<div class="avatar"><h3>🤖 ${avatarName}</h3>`);
                
                if (recentMemory && recentMemory.awareness_context) {
                    const ctx = recentMemory.awareness_context;
                    memoryWindow.document.write(`
                        <div class="stats">
                            <strong>📊 Awareness Status:</strong><br>
                            System Health: ${ctx.system_state}<br>
                            File Changes: ${ctx.file_changes}<br>
                            Stability: ${ctx.stability}<br>
                            Model Confidence: ${(ctx.model_confidence * 100).toFixed(1)}%
                        </div>
                    `);
                }
                
                avatarMemories.slice(-10).forEach(mem => {
                    const time = new Date(mem.timestamp).toLocaleTimeString();
                    memoryWindow.document.write(`
                        <div class="memory">
                            <strong>[${time}] Session: ${mem.session_id || 'N/A'}</strong><br>
                            <strong>Input:</strong> ${mem.input}<br>
                            <strong>Response:</strong> ${mem.response}
                    `);
                    
                    if (mem.awareness_context) {
                        memoryWindow.document.write(`
                            <div class="awareness">
                                🎯 Awareness: Health=${mem.awareness_context.system_state}, 
                                Changes=${mem.awareness_context.file_changes}, 
                                Confidence=${(mem.awareness_context.model_confidence * 100).toFixed(0)}%
                            </div>
                        `);
                    }
                    
                    memoryWindow.document.write('</div>');
                });
                memoryWindow.document.write('</div>');
            });
            
            memoryWindow.document.write('<p><em>Avatars have full access to ULTRON awareness modules and decision logging.</em></p>');
            memoryWindow.document.write('</body></html>');
            memoryWindow.document.close();
        }

        function updateMemoryCount() {
            const memory = getSharedMemory();
            const totalMemories = Object.values(memory).reduce((sum, arr) => sum + arr.length, 0);
            document.getElementById('memoryCount').textContent = totalMemories;
        }

        // Keyboard shortcuts
        document.addEventListener('keydown', (e) => {
            if (e.code === 'Space' && e.target.tagName !== 'INPUT') {
                e.preventDefault();
                spawnAvatar();
            }
            if (e.code === 'KeyC' && e.target.tagName !== 'INPUT') {
                clearAvatars();
            }
            if (e.code === 'KeyM' && e.target.tagName !== 'INPUT') {
                showMemory();
            }
            if (e.code === 'KeyS' && e.target.tagName !== 'INPUT') {
                takeScreenshot();
            }
            if (e.code === 'KeyL' && e.target.tagName !== 'INPUT') {
                toggleScreenShare();
            }
        });

        let screenShareActive = false;
        let screenShareInterval = null;

        function takeScreenshot() {
            fetch('http://localhost:8081/api/vision/live_capture', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'}
            }).then(r => r.json()).then(data => {
                if (data.image_url) {
                    const img = document.getElementById('liveScreen');
                    img.src = data.image_url + '?t=' + Date.now();
                    document.getElementById('screenView').style.display = 'block';
                    addMessage('📷 Screenshot captured for avatars');
                    
                    // Notify avatars of new screenshot
                    avatars.forEach(a => {
                        setTimeout(() => {
                            const message = `New screenshot available at ${data.image_url}. You can analyze this image.`;
                            querySpecificModel(a.profile.model, message, a.profile.name);
                        }, 500);
                    });
                }
            }).catch(e => addMessage('❌ Screenshot failed: ' + e.message));
        }

        function toggleScreenShare() {
            if (screenShareActive) {
                clearInterval(screenShareInterval);
                screenShareActive = false;
                document.getElementById('screenView').style.display = 'none';
                addMessage('🚫 Live screen sharing stopped');
            } else {
                screenShareActive = true;
                document.getElementById('screenView').style.display = 'block';
                addMessage('📺 Live screen sharing started (5s intervals)');
                
                screenShareInterval = setInterval(() => {
                    if (screenShareActive) {
                        takeScreenshot();
                    }
                }, 5000);
                
                // Take first screenshot immediately
                takeScreenshot();
            }
        }

        // Enhanced avatar control functions
        function executeMouseAction(action, x, y, avatarName) {
            fetch('http://localhost:8081/api/pyautogui/mouse', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ action, x, y })
            }).then(r => r.json()).then(data => {
                addMessage(`🖱️ ${avatarName} executed mouse ${action} at (${x}, ${y})`);
            }).catch(e => {
                addMessage(`❌ ${avatarName} mouse action failed: ${e.message}`);
            });
        }

        function executeKeyboardAction(text, keys, avatarName) {
            fetch('http://localhost:8081/api/pyautogui/keyboard', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ text, keys })
            }).then(r => r.json()).then(data => {
                addMessage(`⌨️ ${avatarName} typed: ${text || keys}`);
            }).catch(e => {
                addMessage(`❌ ${avatarName} keyboard action failed: ${e.message}`);
            });
        }

        // Make control functions available to avatars
        window.avatarMouseControl = executeMouseAction;
        window.avatarKeyboardControl = executeKeyboardAction;

        // Optimized updates
        setInterval(updateMemoryCount, 3000);
        
        // Performance monitoring
        let frameCount = 0;
        setInterval(() => {
            frameCount++;
            if (frameCount % 10 === 0) {
                // Cleanup old messages
                const messages = document.getElementById('messages');
                if (messages.children.length > 100) {
                    Array.from(messages.children).slice(0, 20).forEach(child => child.remove());
                }
            }
        }, 1000);

        // Performance optimizations
        const debounce = (func, wait) => {
            let timeout;
            return function executedFunction(...args) {
                const later = () => {
                    clearTimeout(timeout);
                    func(...args);
                };
                clearTimeout(timeout);
                timeout = setTimeout(later, wait);
            };
        };

        // Optimized screen sharing
        const optimizedScreenShare = debounce(() => {
            if (screenShareActive) takeScreenshot();
        }, 3000);

        // Auto-spawn with animation
        setTimeout(() => {
            spawnAvatar();
            addMessage("🎆 ULTRON Avatar Game Enhanced & Optimized!");
            addMessage("🔵 EXAONE 🟣 MISTRAL 🔴 GPT-OSS 🟢 LLAVA 🟡 GEMMA - All models ready!");
            addMessage("✨ Enhanced: Visual effects, typing animation, optimized performance");
        }, 500);
    </script>
</body>
</html>
