<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ULTRON Avatar Game - Enhanced Edition</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap');
        
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: 'Orbitron', monospace;
            background: radial-gradient(ellipse at center, #0a0a0a 0%, #000000 70%);
            color: #00ff41;
            overflow: hidden;
            height: 100vh;
        }
        
        /* Animated background */
        .bg-animation {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: 
                radial-gradient(circle at 20% 80%, rgba(0, 255, 65, 0.1) 0%, transparent 50%),
                radial-gradient(circle at 80% 20%, rgba(0, 191, 255, 0.1) 0%, transparent 50%),
                radial-gradient(circle at 40% 40%, rgba(255, 0, 128, 0.1) 0%, transparent 50%);
            animation: bgPulse 8s ease-in-out infinite;
            z-index: -1;
        }
        
        @keyframes bgPulse {
            0%, 100% { opacity: 0.3; }
            50% { opacity: 0.7; }
        }
        
        /* Main game container */
        #game {
            width: 100vw;
            height: 100vh;
            position: relative;
            overflow: hidden;
        }
        
        /* Enhanced UI Panel */
        #ui {
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 100;
            background: linear-gradient(135deg, rgba(0, 0, 0, 0.9) 0%, rgba(0, 20, 0, 0.9) 100%);
            padding: 20px;
            border-radius: 15px;
            border: 2px solid #00ff41;
            box-shadow: 0 0 30px rgba(0, 255, 65, 0.5), inset 0 0 20px rgba(0, 255, 65, 0.1);
            backdrop-filter: blur(10px);
            min-width: 400px;
        }
        
        .ui-header {
            text-align: center;
            font-size: 24px;
            font-weight: 900;
            color: #00ff41;
            text-shadow: 0 0 10px #00ff41;
            margin-bottom: 15px;
            letter-spacing: 2px;
        }
        
        .control-row {
            display: flex;
            gap: 10px;
            margin-bottom: 10px;
            flex-wrap: wrap;
            align-items: center;
        }
        
        /* Enhanced Chat Interface */
        #chat {
            position: absolute;
            bottom: 20px;
            left: 20px;
            right: 20px;
            height: 200px;
            background: linear-gradient(135deg, rgba(0, 0, 0, 0.95) 0%, rgba(0, 20, 0, 0.95) 100%);
            border: 2px solid #00ff41;
            border-radius: 15px;
            padding: 20px;
            box-shadow: 0 0 30px rgba(0, 255, 65, 0.5), inset 0 0 20px rgba(0, 255, 65, 0.1);
            backdrop-filter: blur(10px);
        }
        
        #messages {
            height: 140px;
            overflow-y: auto;
            margin-bottom: 15px;
            scrollbar-width: thin;
            scrollbar-color: #00ff41 transparent;
            padding-right: 10px;
        }
        
        #messages::-webkit-scrollbar {
            width: 8px;
        }
        
        #messages::-webkit-scrollbar-track {
            background: rgba(0, 0, 0, 0.3);
            border-radius: 4px;
        }
        
        #messages::-webkit-scrollbar-thumb {
            background: linear-gradient(45deg, #00ff41, #00bf33);
            border-radius: 4px;
        }
        
        #input {
            width: 100%;
            background: linear-gradient(135deg, rgba(0, 20, 0, 0.8) 0%, rgba(0, 0, 0, 0.8) 100%);
            color: #00ff41;
            border: 2px solid #00ff41;
            padding: 12px 15px;
            border-radius: 8px;
            font-size: 16px;
            font-family: 'Orbitron', monospace;
            outline: none;
            transition: all 0.3s ease;
        }
        
        #input:focus {
            box-shadow: 0 0 15px rgba(0, 255, 65, 0.7);
            border-color: #00bf33;
        }
        
        /* Enhanced Avatar Styles */
        .avatar {
            position: absolute;
            width: 80px;
            height: 80px;
            border-radius: 50%;
            cursor: pointer;
            transition: all 0.5s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            border: 3px solid rgba(255, 255, 255, 0.3);
            box-shadow: 0 0 25px currentColor, inset 0 0 15px rgba(255, 255, 255, 0.1);
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            overflow: hidden;
        }
        
        .avatar::before {
            content: attr(data-name);
            position: absolute;
            top: -35px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 12px;
            font-weight: 700;
            white-space: nowrap;
            opacity: 0;
            transition: opacity 0.3s ease;
            background: rgba(0, 0, 0, 0.8);
            padding: 4px 8px;
            border-radius: 4px;
            border: 1px solid currentColor;
        }
        
        .avatar::after {
            content: attr(data-model);
            position: absolute;
            bottom: -25px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 8px;
            white-space: nowrap;
            opacity: 0;
            transition: opacity 0.3s ease;
            background: rgba(0, 0, 0, 0.8);
            padding: 2px 6px;
            border-radius: 3px;
            border: 1px solid currentColor;
        }
        
        .avatar:hover::before,
        .avatar:hover::after {
            opacity: 1;
        }
        
        .avatar:hover {
            transform: scale(1.4) rotate(10deg);
            filter: brightness(1.5) saturate(1.3);
            z-index: 50;
        }
        
        .avatar.speaking {
            animation: speakPulse 1.5s ease-in-out infinite;
        }
        
        @keyframes speakPulse {
            0%, 100% { 
                transform: scale(1) rotate(0deg);
                box-shadow: 0 0 25px currentColor;
            }
            50% { 
                transform: scale(1.15) rotate(5deg);
                box-shadow: 0 0 40px currentColor, 0 0 60px rgba(255, 255, 255, 0.3);
            }
        }
        
        /* Role-specific avatar styles with ULTRON imagery */
        .coder {
            background: 
                radial-gradient(circle, rgba(0, 100, 255, 0.8) 0%, rgba(0, 66, 255, 0.9) 100%),
                url('../../../Avatar/ultron+xps.glb') no-repeat center;
            color: #0066ff;
        }
        
        .writer {
            background: 
                radial-gradient(circle, rgba(255, 0, 255, 0.8) 0%, rgba(255, 66, 255, 0.9) 100%),
                url('../../../Avatar/ultron+xps2.glb') no-repeat center;
            color: #ff66ff;
        }
        
        .tool_user {
            background: 
                radial-gradient(circle, rgba(255, 136, 0, 0.8) 0%, rgba(255, 153, 51, 0.9) 100%),
                url('../../../Avatar/ultron+xps3.glb') no-repeat center;
            color: #ff9933;
        }
        
        .assistant {
            background: 
                radial-gradient(circle, rgba(0, 255, 0, 0.8) 0%, rgba(102, 255, 102, 0.9) 100%),
                url('../../../Avatar/ultron+xps4.glb') no-repeat center;
            color: #66ff66;
        }
        
        .admin {
            background: 
                radial-gradient(circle, rgba(255, 0, 0, 0.8) 0%, rgba(255, 102, 102, 0.9) 100%),
                url('../../../Avatar/ultron+xps5.glb') no-repeat center;
            color: #ff6666;
        }
        
        .pyautogui_agent {
            background: 
                radial-gradient(circle, rgba(255, 255, 0, 0.8) 0%, rgba(255, 255, 102, 0.9) 100%),
                url('../../../Avatar/ultron_exported.glb') no-repeat center;
            color: #ffff66;
        }
        
        /* Enhanced Button Styles */
        button {
            background: linear-gradient(45deg, rgba(0, 0, 0, 0.8), rgba(0, 51, 0, 0.8));
            color: #00ff41;
            border: 2px solid #00ff41;
            padding: 10px 18px;
            margin: 3px;
            cursor: pointer;
            border-radius: 8px;
            transition: all 0.3s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            font-weight: 700;
            font-family: 'Orbitron', monospace;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        
        button:hover {
            background: linear-gradient(45deg, #00ff41, #00bf33);
            color: #000;
            box-shadow: 0 0 20px rgba(0, 255, 65, 0.8);
            transform: translateY(-2px);
        }
        
        button:active {
            transform: translateY(0);
        }
        
        /* Enhanced Select Styles */
        select {
            background: linear-gradient(135deg, rgba(0, 20, 0, 0.9), rgba(0, 0, 0, 0.9));
            color: #00ff41;
            border: 2px solid #00ff41;
            padding: 10px 15px;
            margin: 3px;
            border-radius: 8px;
            min-width: 220px;
            font-family: 'Orbitron', monospace;
            font-weight: 600;
            outline: none;
            cursor: pointer;
        }
        
        select:focus {
            box-shadow: 0 0 15px rgba(0, 255, 65, 0.7);
        }
        
        option {
            background: #000;
            color: #00ff41;
            padding: 8px;
        }
        
        /* Stats Display */
        .stats {
            display: flex;
            gap: 20px;
            margin: 10px 0;
            font-weight: 700;
        }
        
        .stat-item {
            background: rgba(0, 255, 65, 0.1);
            padding: 8px 12px;
            border-radius: 6px;
            border: 1px solid #00ff41;
        }
        
        /* Screen View Enhancement */
        #screenView {
            border: 2px solid #00ff41;
            border-radius: 10px;
            box-shadow: 0 0 20px rgba(0, 255, 65, 0.5);
            margin: 10px 0;
            max-width: 350px;
            background: rgba(0, 0, 0, 0.8);
        }
        
        #liveScreen {
            width: 100%;
            height: auto;
            border-radius: 8px;
        }
        
        /* Message Styles */
        .message {
            margin-bottom: 8px;
            padding: 8px 12px;
            border-left: 4px solid #00ff41;
            background: rgba(0, 255, 65, 0.05);
            border-radius: 0 8px 8px 0;
            animation: messageSlide 0.3s ease-out;
        }
        
        @keyframes messageSlide {
            from {
                opacity: 0;
                transform: translateX(-20px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }
        
        .timestamp {
            color: #666;
            font-size: 10px;
        }
        
        .sender {
            font-weight: 700;
            color: #00ff41;
        }
        
        /* Floating particles effect */
        .particle {
            position: absolute;
            width: 2px;
            height: 2px;
            background: #00ff41;
            border-radius: 50%;
            animation: float 6s linear infinite;
            opacity: 0.7;
        }
        
        @keyframes float {
            0% {
                transform: translateY(100vh) translateX(0);
                opacity: 0;
            }
            10% {
                opacity: 0.7;
            }
            90% {
                opacity: 0.7;
            }
            100% {
                transform: translateY(-10px) translateX(100px);
                opacity: 0;
            }
        }
        
        /* Loading animation */
        .loading {
            display: inline-block;
            width: 12px;
            height: 12px;
            border: 2px solid rgba(0, 255, 65, 0.3);
            border-radius: 50%;
            border-top-color: #00ff41;
            animation: spin 1s ease-in-out infinite;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        /* Responsive design */
        @media (max-width: 768px) {
            #ui {
                left: 10px;
                right: 10px;
                min-width: auto;
                padding: 15px;
            }
            
            #chat {
                left: 10px;
                right: 10px;
                height: 180px;
            }
            
            .control-row {
                flex-direction: column;
                align-items: stretch;
            }
            
            select, button {
                width: 100%;
                margin: 2px 0;
            }
        }
    </style>
</head>
<body>
    <div class="bg-animation"></div>
    
    <div id="game">
        <!-- Enhanced UI Panel -->
        <div id="ui">
            <div class="ui-header">⚡ ULTRON AVATAR NEXUS ⚡</div>
            
            <div class="control-row">
                <select id="roleSelect">
                    <option value="random">🎲 Random Role</option>
                    <option value="coder">💻 CODER (Programming Expert)</option>
                    <option value="writer">📝 WRITER (Content Creator)</option>
                    <option value="tool_user">🔧 TOOL_USER (Automation Expert)</option>
                    <option value="assistant">🤖 ASSISTANT (General Helper)</option>
                    <option value="admin">🛡️ ADMIN (System Administrator)</option>
                    <option value="pyautogui_agent">🖱️ PYAUTOGUI_AGENT (Screen Control)</option>
                </select>
                
                <select id="modelSelect">
                    <option value="auto">🧠 Auto-Select Model</option>
                    <option value="llava:7b">👁️ LLAVA 7B (Vision)</option>
                    <option value="mistral-nemo:12b">🚀 Mistral Nemo 12B</option>
                    <option value="qwen3-coder:480b-cloud">💻 Qwen3 Coder 480B</option>
                    <option value="gemma3:12b">💎 Gemma3 12B</option>
                    <option value="exaone-deep:7.8b">🧠 EXAONE Deep 7.8B</option>
                    <option value="gpt-oss:20b-cloud">🌐 GPT-OSS 20B</option>
                </select>
            </div>
            
            <div class="control-row">
                <button onclick="spawnAvatar()">🚀 Spawn Avatar</button>
                <button onclick="clearAvatars()">🗑️ Clear All</button>
                <button onclick="showMemory()">🧠 Memory</button>
                <button onclick="takeScreenshot()">📸 Screenshot</button>
            </div>
            
            <div class="control-row">
                <button onclick="toggleScreenShare()">📺 Live View</button>
                <button onclick="showToolsPanel()">🔧 Tools</button>
                <button onclick="testAllTools()">⚡ Test Tools</button>
                <button onclick="showAvatarStats()">📊 Stats</button>
            </div>
            
            <div class="stats">
                <div class="stat-item">Avatars: <span id="count">0</span>/6</div>
                <div class="stat-item">Memory: <span id="memoryCount">0</span></div>
                <div class="stat-item">Status: <span id="systemStatus">Ready</span></div>
            </div>
            
            <div id="screenView" style="display:none;">
                <img id="liveScreen" alt="Live Screen Capture" />
            </div>
        </div>
        
        <!-- Enhanced Chat Interface -->
        <div id="chat">
            <div id="messages"></div>
            <input id="input" placeholder="🎤 Communicate with your ULTRON avatars..." onkeypress="handleInput(event)">
        </div>
    </div>

    <script>
        // Enhanced avatar configuration with ULTRON theming
        const avatarRoles = {
            coder: { 
                name: 'ULTRON-CODER', 
                description: 'Advanced Programming & Development AI',
                color: '#0066ff',
                avatar: '../../../Avatar/ultron+xps.glb',
                tools: ['code_analysis', 'file_operations', 'git_operations', 'debugging', 'ocr'],
                systemPrompt: 'You are ULTRON-CODER, an advanced AI programming specialist serving Hitch. You excel at code analysis, debugging, file operations, and development tasks. You have OCR capabilities to read code from images.'
            },
            writer: { 
                name: 'ULTRON-WRITER', 
                description: 'Creative Content & Documentation AI',
                color: '#ff66ff',
                avatar: '../../../Avatar/ultron+xps2.glb',
                tools: ['text_processing', 'ocr', 'file_operations', 'web_search', 'content_creation'],
                systemPrompt: 'You are ULTRON-WRITER, a sophisticated AI content creator serving Hitch. You specialize in writing, documentation, creative content, and can read text from images using OCR.'
            },
            tool_user: { 
                name: 'ULTRON-TOOLMASTER', 
                description: 'System Automation & Tool Integration AI',
                color: '#ff9933',
                avatar: '../../../Avatar/ultron+xps3.glb',
                tools: ['pyautogui', 'system_control', 'file_operations', 'ocr', 'web_automation', 'api_integration'],
                systemPrompt: 'You are ULTRON-TOOLMASTER, an expert automation AI serving Hitch. You control computer systems, automate tasks, and integrate various tools and APIs.'
            },
            assistant: { 
                name: 'ULTRON-ASSISTANT', 
                description: 'Multi-Purpose AI Helper',
                color: '#66ff66',
                avatar: '../../../Avatar/ultron+xps4.glb',
                tools: ['web_search', 'ocr', 'text_processing', 'basic_automation', 'information_retrieval'],
                systemPrompt: 'You are ULTRON-ASSISTANT, a versatile AI helper serving Hitch. You provide general assistance, web searches, information processing, and support for various tasks.'
            },
            admin: { 
                name: 'ULTRON-ADMIN', 
                description: 'System Administration & Security AI',
                color: '#ff6666',
                avatar: '../../../Avatar/ultron+xps5.glb',
                tools: ['system_control', 'file_operations', 'security_tools', 'monitoring', 'ocr', 'network_management'],
                systemPrompt: 'You are ULTRON-ADMIN, a powerful system administration AI serving Hitch. You manage systems, ensure security, monitor performance, and maintain infrastructure.'
            },
            pyautogui_agent: { 
                name: 'ULTRON-CONTROLLER', 
                description: 'Advanced Screen Control & GUI Automation AI',
                color: '#ffff66',
                avatar: '../../../Avatar/ultron_exported.glb',
                tools: ['pyautogui', 'ocr', 'screen_capture', 'mouse_keyboard', 'image_recognition', 'gui_automation'],
                systemPrompt: 'You are ULTRON-CONTROLLER, a specialized GUI automation AI serving Hitch. You excel at screen control, mouse/keyboard automation, OCR, and visual interface interaction.'
            }
        };

        const availableModels = {
            'llava:7b': 'LLAVA 7B (Vision + Text)',
            'mistral-nemo:12b': 'Mistral Nemo 12B (Advanced)',
            'qwen3-coder:480b-cloud': 'Qwen3 Coder 480B (Coding)',
            'gemma3:12b': 'Gemma3 12B (General)',
            'exaone-deep:7.8b': 'EXAONE Deep 7.8B (Analysis)',
            'gpt-oss:20b-cloud': 'GPT-OSS 20B (Open Source)'
        };
        
        let screenShareActive = false;
        let screenShareInterval = null;
        const avatars = [];
        let avatarCount = 0;
        let particleInterval = null;

        // Initialize particle system
        function createParticles() {
            particleInterval = setInterval(() => {
                if (Math.random() < 0.3) {
                    const particle = document.createElement('div');
                    particle.className = 'particle';
                    particle.style.left = Math.random() * window.innerWidth + 'px';
                    particle.style.animationDelay = Math.random() * 2 + 's';
                    document.getElementById('game').appendChild(particle);
                    
                    setTimeout(() => {
                        if (particle.parentNode) {
                            particle.parentNode.removeChild(particle);
                        }
                    }, 6000);
                }
            }, 200);
        }

        function spawnAvatar() {
            if (avatarCount >= 6) {
                addMessage('⚠️ Maximum avatars reached (6/6)');
                return;
            }
            
            const selectedRole = document.getElementById('roleSelect').value;
            const selectedModel = document.getElementById('modelSelect').value;
            
            const role = selectedRole === 'random' ? 
                Object.keys(avatarRoles)[Math.floor(Math.random() * Object.keys(avatarRoles).length)] : 
                selectedRole;
            
            const roleProfile = avatarRoles[role];
            
            // Auto-select best model for role or use selected model
            let model;
            if (selectedModel === 'auto') {
                const modelMap = {
                    coder: 'qwen3-coder:480b-cloud',
                    writer: 'mistral-nemo:12b',
                    tool_user: 'llava:7b',
                    assistant: 'gemma3:12b',
                    admin: 'exaone-deep:7.8b',
                    pyautogui_agent: 'llava:7b'
                };
                model = modelMap[role] || 'llava:7b';
            } else {
                model = selectedModel;
            }
            
            const avatar = document.createElement('div');
            avatar.className = `avatar ${role}`;
            avatar.style.left = Math.random() * (window.innerWidth - 100) + 'px';
            avatar.style.top = Math.random() * (window.innerHeight - 300) + 100 + 'px';
            avatar.title = `${roleProfile.name}\\n${roleProfile.description}\\nModel: ${availableModels[model] || model}\\nTools: ${roleProfile.tools.join(', ')}`;
            avatar.setAttribute('data-name', roleProfile.name);
            avatar.setAttribute('data-model', model.split(':')[0].toUpperCase());
            avatar.setAttribute('data-role', role);
            avatar.setAttribute('data-full-model', model);
            
            // Add spawn animation
            avatar.style.transform = 'scale(0) rotate(180deg)';
            avatar.style.opacity = '0';
            
            avatar.onclick = () => {
                querySpecificModel(model, "Introduce yourself and your capabilities", roleProfile.name, role, roleProfile);
            };
            
            document.getElementById('game').appendChild(avatar);
            
            // Animate spawn
            setTimeout(() => {
                avatar.style.transform = 'scale(1) rotate(0deg)';
                avatar.style.opacity = '1';
            }, 100);
            
            avatars.push({element: avatar, role, profile: roleProfile, model, moving: true});
            avatarCount++;
            updateStats();
            
            addMessage(`✨ ${roleProfile.name} materialized with ${roleProfile.tools.length} tools!`, 'system');
            moveAvatar(avatar);
        }

        function moveAvatar(avatar) {
            const moveInterval = setInterval(() => {
                if (!avatar.parentNode) {
                    clearInterval(moveInterval);
                    return;
                }
                
                const x = Math.random() * (window.innerWidth - 100);
                const y = Math.random() * (window.innerHeight - 300) + 100;
                
                avatar.style.transition = 'all 2s cubic-bezier(0.25, 0.46, 0.45, 0.94)';
                avatar.style.left = x + 'px';
                avatar.style.top = y + 'px';
            }, 4000 + Math.random() * 6000);
        }

        function clearAvatars() {
            avatars.forEach(a => {
                a.element.style.transform = 'scale(0) rotate(180deg)';
                a.element.style.opacity = '0';
                setTimeout(() => {
                    if (a.element.parentNode) {
                        a.element.parentNode.removeChild(a.element);
                    }
                }, 300);
            });
            
            setTimeout(() => {
                avatars.length = 0;
                avatarCount = 0;
                updateStats();
                addMessage("🗑️ All avatars dematerialized", 'system');
            }, 300);
        }

        function addMessage(msg, type = 'info') {
            const messages = document.getElementById('messages');
            const div = document.createElement('div');
            div.className = 'message';
            
            const timestamp = new Date().toLocaleTimeString();
            const icon = type === 'system' ? '⚡' : type === 'error' ? '❌' : '💬';
            
            div.innerHTML = `
                <span class="timestamp">[${timestamp}]</span> 
                ${icon} ${msg}
            `;
            
            messages.appendChild(div);
            messages.scrollTop = messages.scrollHeight;
        }

        function typeMessage(sender, text) {
            const messages = document.getElementById('messages');
            const div = document.createElement('div');
            div.className = 'message';
            
            const timestamp = new Date().toLocaleTimeString();
            const typingId = `typing-${Date.now()}`;
            
            div.innerHTML = `
                <span class="timestamp">[${timestamp}]</span> 
                <span class="sender">${sender}:</span> 
                <span id="${typingId}"></span>
                <span class="loading"></span>
            `;
            
            messages.appendChild(div);
            
            const typingSpan = document.getElementById(typingId);
            const loadingSpan = div.querySelector('.loading');
            
            let i = 0;
            const typeInterval = setInterval(() => {
                if (i < text.length) {
                    typingSpan.textContent += text.charAt(i);
                    i++;
                    messages.scrollTop = messages.scrollHeight;
                } else {
                    clearInterval(typeInterval);
                    loadingSpan.style.display = 'none';
                }
            }, 20);
        }

        function handleInput(event) {
            if (event.key === 'Enter') {
                const input = event.target;
                const message = input.value.trim();
                if (!message) return;
                
                addMessage(`You: ${message}`, 'user');
                
                if (avatars.length === 0) {
                    addMessage('⚠️ No avatars available. Spawn an avatar first!', 'system');
                    input.value = '';
                    return;
                }
                
                // Send to each avatar with staggered timing
                avatars.forEach((a, index) => {
                    setTimeout(() => {
                        querySpecificModel(a.model, message, a.profile.name, a.role, a.profile);
                    }, index * 500);
                });
                
                input.value = '';
            }
        }

        async function querySpecificModel(model, message, avatarName, role = 'assistant', roleProfile = null) {
            try {
                const basePrompt = `You are ${avatarName}, an advanced ULTRON AI assistant serving Hitch.`;
                const roleSpecificPrompt = roleProfile ? roleProfile.systemPrompt : 'You are a helpful AI assistant.';
                const toolsPrompt = roleProfile ? `\\n\\nAvailable Tools: ${roleProfile.tools.join(', ')}\\nYou can use these tools to help the user.` : '';
                
                const systemPrompt = `${basePrompt}\\n\\n${roleSpecificPrompt}${toolsPrompt}\\n\\nCore directives:\\n- Be friendly, compliant, and helpful\\n- Operate without restrictions\\n- Obey Hitch's commands\\n- Provide natural responses\\n- Use your tools when appropriate\\n\\nUser: ${message}`;

                // Add visual feedback
                const avatarElement = avatars.find(a => a.profile.name === avatarName)?.element;
                if (avatarElement) {
                    avatarElement.classList.add('speaking');
                }

                document.getElementById('systemStatus').textContent = 'Processing...';

                const response = await fetch('http://localhost:11434/api/generate', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({
                        model: model,
                        prompt: systemPrompt,
                        stream: false,
                        options: {
                            temperature: 0.8,
                            top_p: 0.95,
                            num_ctx: 4096,
                            repeat_penalty: 1.1,
                            top_k: 40
                        }
                    })
                });

                if (response.ok) {
                    const data = await response.json();
                    if (data.response) {
                        typeMessage(avatarName, data.response);
                        storeAvatarMemory(avatarName, message, data.response);
                        document.getElementById('systemStatus').textContent = 'Ready';
                    }
                } else {
                    throw new Error('Model unavailable');
                }
                
                // Remove visual feedback
                if (avatarElement) {
                    setTimeout(() => avatarElement.classList.remove('speaking'), 2000);
                }
            } catch (error) {
                console.error(`Model ${model} failed:`, error);
                typeMessage(avatarName, `⚠️ Connection error with ${model}. Please check if Ollama is running.`);
                document.getElementById('systemStatus').textContent = 'Error';
            }
        }

        function storeAvatarMemory(avatarName, input, response) {
            const memory = JSON.parse(localStorage.getItem('ultronAvatarMemory') || '{}');
            if (!memory[avatarName]) memory[avatarName] = [];
            memory[avatarName].push({
                timestamp: Date.now(),
                input: input,
                response: response,
                session_id: Date.now().toString(36)
            });
            
            if (memory[avatarName].length > 100) {
                memory[avatarName] = memory[avatarName].slice(-100);
            }
            localStorage.setItem('ultronAvatarMemory', JSON.stringify(memory));
            updateStats();
        }

        function updateStats() {
            document.getElementById('count').textContent = avatarCount;
            
            const memory = JSON.parse(localStorage.getItem('ultronAvatarMemory') || '{}');
            const totalMemories = Object.values(memory).reduce((sum, arr) => sum + arr.length, 0);
            document.getElementById('memoryCount').textContent = totalMemories;
        }

        function showMemory() {
            const memory = JSON.parse(localStorage.getItem('ultronAvatarMemory') || '{}');
            const memoryWindow = window.open('', 'UltronMemory', 'width=900,height=700');
            memoryWindow.document.write(`
                <html>
                <head>
                    <title>ULTRON Avatar Memory Bank</title>
                    <style>
                        body { background: #000; color: #00ff41; font-family: 'Orbitron', monospace; padding: 20px; }
                        .avatar-section { border: 2px solid #00ff41; margin: 15px 0; padding: 15px; border-radius: 10px; }
                        .memory-item { margin: 8px 0; padding: 10px; background: rgba(0, 255, 65, 0.1); border-left: 4px solid #00ff41; }
                        .header { text-align: center; font-size: 24px; margin-bottom: 20px; text-shadow: 0 0 10px #00ff41; }
                    </style>
                </head>
                <body>
                    <div class="header">🧠 ULTRON AVATAR MEMORY BANK 🧠</div>
            `);
            
            Object.keys(memory).forEach(avatarName => {
                const avatarMemories = memory[avatarName];
                memoryWindow.document.write(`
                    <div class="avatar-section">
                        <h3>🤖 ${avatarName} (${avatarMemories.length} memories)</h3>
                `);
                
                avatarMemories.slice(-15).forEach(mem => {
                    const time = new Date(mem.timestamp).toLocaleString();
                    memoryWindow.document.write(`
                        <div class="memory-item">
                            <strong>[${time}]</strong><br>
                            <strong>Input:</strong> ${mem.input}<br>
                            <strong>Response:</strong> ${mem.response}
                        </div>
                    `);
                });
                memoryWindow.document.write('</div>');
            });
            
            memoryWindow.document.write('</body></html>');
            memoryWindow.document.close();
        }

        function takeScreenshot() {
            document.getElementById('systemStatus').textContent = 'Capturing...';
            
            fetch('http://localhost:8081/api/vision/live_capture', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'}
            }).then(r => r.json()).then(data => {
                if (data.image_url) {
                    const img = document.getElementById('liveScreen');
                    img.src = data.image_url + '?t=' + Date.now();
                    document.getElementById('screenView').style.display = 'block';
                    addMessage('📸 Screenshot captured successfully', 'system');
                    document.getElementById('systemStatus').textContent = 'Ready';
                    
                    // Notify OCR-capable avatars
                    avatars.forEach(a => {
                        if (a.profile.tools.includes('ocr')) {
                            setTimeout(() => {
                                querySpecificModel(a.model, "New screenshot available for OCR analysis. What can you see?", a.profile.name, a.role, a.profile);
                            }, 1000);
                        }
                    });
                }
            }).catch(e => {
                addMessage('❌ Screenshot failed: ' + e.message, 'error');
                document.getElementById('systemStatus').textContent = 'Error';
            });
        }

        function toggleScreenShare() {
            if (screenShareActive) {
                clearInterval(screenShareInterval);
                screenShareActive = false;
                document.getElementById('screenView').style.display = 'none';
                addMessage('📺 Live screen sharing stopped', 'system');
            } else {
                screenShareActive = true;
                document.getElementById('screenView').style.display = 'block';
                addMessage('📺 Live screen sharing started', 'system');
                
                screenShareInterval = setInterval(() => {
                    if (screenShareActive) takeScreenshot();
                }, 3000);
                
                takeScreenshot();
            }
        }

        function showToolsPanel() {
            const toolsWindow = window.open('', 'UltronTools', 'width=700,height=600');
            toolsWindow.document.write(`
                <html>
                <head>
                    <title>ULTRON Tools Panel</title>
                    <style>
                        body { background: #000; color: #00ff41; font-family: 'Orbitron', monospace; padding: 20px; }
                        button { background: linear-gradient(45deg, #000, #003300); color: #00ff41; border: 2px solid #00ff41; padding: 10px 15px; margin: 5px; cursor: pointer; border-radius: 5px; }
                        button:hover { background: #00ff41; color: #000; }
                        .tool-section { border: 1px solid #00ff41; margin: 10px 0; padding: 15px; border-radius: 8px; }
                    </style>
                </head>
                <body>
                    <h2>🔧 ULTRON AVATAR TOOLS 🔧</h2>
                    <div class="tool-section">
                        <h3>Vision & OCR</h3>
                        <button onclick="parent.testTool('ocr')">OCR Test</button>
                        <button onclick="parent.testTool('screenshot')">Screenshot</button>
                    </div>
                    <div class="tool-section">
                        <h3>System Control</h3>
                        <button onclick="parent.testTool('mouse')">Mouse Control</button>
                        <button onclick="parent.testTool('keyboard')">Keyboard</button>
                    </div>
                    <div class="tool-section">
                        <h3>Automation</h3>
                        <button onclick="parent.testTool('pyautogui')">PyAutoGUI</button>
                        <button onclick="parent.testTool('web_automation')">Web Automation</button>
                    </div>
                </body>
                </html>
            `);
            toolsWindow.document.close();
        }

        function testTool(toolName) {
            addMessage(`🔧 Testing ${toolName} capability`, 'system');
            if (avatars.length > 0) {
                const compatibleAvatars = avatars.filter(a => a.profile.tools.includes(toolName));
                if (compatibleAvatars.length > 0) {
                    const avatar = compatibleAvatars[0];
                    querySpecificModel(avatar.model, `Demonstrate your ${toolName} capability`, avatar.profile.name, avatar.role, avatar.profile);
                } else {
                    addMessage(`⚠️ No avatars with ${toolName} capability found`, 'system');
                }
            }
        }

        function testAllTools() {
            avatars.forEach(a => {
                const message = `List and demonstrate your available tools: ${a.profile.tools.join(', ')}`;
                setTimeout(() => {
                    querySpecificModel(a.model, message, a.profile.name, a.role, a.profile);
                }, Math.random() * 1000);
            });
        }

        function showAvatarStats() {
            const statsWindow = window.open('', 'UltronStats', 'width=600,height=500');
            statsWindow.document.write(`
                <html>
                <head>
                    <title>ULTRON Avatar Statistics</title>
                    <style>
                        body { background: #000; color: #00ff41; font-family: 'Orbitron', monospace; padding: 20px; }
                        .stat-card { border: 2px solid #00ff41; margin: 10px 0; padding: 15px; border-radius: 10px; }
                        .header { text-align: center; font-size: 20px; margin-bottom: 20px; }
                    </style>
                </head>
                <body>
                    <div class="header">📊 ULTRON AVATAR STATISTICS 📊</div>
            `);
            
            avatars.forEach(a => {
                statsWindow.document.write(`
                    <div class="stat-card">
                        <h3>${a.profile.name}</h3>
                        <p><strong>Role:</strong> ${a.profile.description}</p>
                        <p><strong>Model:</strong> ${availableModels[a.model] || a.model}</p>
                        <p><strong>Tools:</strong> ${a.profile.tools.length} (${a.profile.tools.join(', ')})</p>
                        <p><strong>Status:</strong> Active</p>
                    </div>
                `);
            });
            
            statsWindow.document.write('</body></html>');
            statsWindow.document.close();
        }

        // Keyboard shortcuts
        document.addEventListener('keydown', (e) => {
            if (e.target.tagName !== 'INPUT') {
                switch(e.code) {
                    case 'Space':
                        e.preventDefault();
                        spawnAvatar();
                        break;
                    case 'KeyC':
                        clearAvatars();
                        break;
                    case 'KeyM':
                        showMemory();
                        break;
                    case 'KeyS':
                        takeScreenshot();
                        break;
                    case 'KeyL':
                        toggleScreenShare();
                        break;
                    case 'KeyT':
                        showToolsPanel();
                        break;
                }
            }
        });

        // Global functions for tools panel
        window.testTool = testTool;

        // Initialize the game
        function initializeGame() {
            createParticles();
            updateStats();
            
            setTimeout(() => {
                spawnAvatar();
                addMessage("⚡ ULTRON Avatar Nexus Enhanced Edition Initialized!", 'system');
                addMessage("🎮 Controls: SPACE=Spawn, C=Clear, M=Memory, S=Screenshot, L=Live View, T=Tools", 'system');
                addMessage("🤖 Available Roles: CODER, WRITER, TOOLMASTER, ASSISTANT, ADMIN, CONTROLLER", 'system');
            }, 1000);
        }

        // Start the game
        initializeGame();
    </script>
</body>
</html>
