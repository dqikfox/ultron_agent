<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ULTRON 3D Avatar Viewer</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap');
        
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: 'Orbitron', monospace;
            background: radial-gradient(ellipse at center, #0a0a0a 0%, #000000 70%);
            color: #00ff41;
            overflow: hidden;
            height: 100vh;
        }
        
        #container {
            width: 100vw;
            height: 100vh;
            position: relative;
        }
        
        #ui {
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 100;
            background: linear-gradient(135deg, rgba(0, 0, 0, 0.9) 0%, rgba(0, 20, 0, 0.9) 100%);
            padding: 20px;
            border-radius: 15px;
            border: 2px solid #00ff41;
            box-shadow: 0 0 30px rgba(0, 255, 65, 0.5);
            backdrop-filter: blur(10px);
        }
        
        .title {
            font-size: 24px;
            font-weight: 900;
            text-align: center;
            margin-bottom: 15px;
            text-shadow: 0 0 10px #00ff41;
        }
        
        .model-selector {
            margin-bottom: 15px;
        }
        
        select {
            background: linear-gradient(135deg, rgba(0, 20, 0, 0.9), rgba(0, 0, 0, 0.9));
            color: #00ff41;
            border: 2px solid #00ff41;
            padding: 10px 15px;
            border-radius: 8px;
            width: 100%;
            font-family: 'Orbitron', monospace;
            font-weight: 600;
        }
        
        button {
            background: linear-gradient(45deg, rgba(0, 0, 0, 0.8), rgba(0, 51, 0, 0.8));
            color: #00ff41;
            border: 2px solid #00ff41;
            padding: 10px 15px;
            margin: 5px 0;
            cursor: pointer;
            border-radius: 8px;
            width: 100%;
            font-family: 'Orbitron', monospace;
            font-weight: 700;
            transition: all 0.3s ease;
        }
        
        button:hover {
            background: linear-gradient(45deg, #00ff41, #00bf33);
            color: #000;
            box-shadow: 0 0 15px rgba(0, 255, 65, 0.8);
        }
        
        .info {
            margin-top: 15px;
            padding: 10px;
            background: rgba(0, 255, 65, 0.1);
            border-radius: 8px;
            border: 1px solid #00ff41;
            font-size: 12px;
        }
        
        .loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 18px;
            text-align: center;
            z-index: 50;
        }
        
        .spinner {
            display: inline-block;
            width: 40px;
            height: 40px;
            border: 4px solid rgba(0, 255, 65, 0.3);
            border-radius: 50%;
            border-top-color: #00ff41;
            animation: spin 1s ease-in-out infinite;
            margin-bottom: 10px;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div id="container">
        <div id="ui">
            <div class="title">⚡ ULTRON 3D VIEWER ⚡</div>
            
            <div class="model-selector">
                <select id="modelSelect">
                    <option value="ultron+xps.glb">ULTRON XPS Base Model</option>
                    <option value="ultron+xps2.glb">ULTRON XPS Variant 2</option>
                    <option value="ultron+xps3.glb">ULTRON XPS Variant 3</option>
                    <option value="ultron+xps4.glb">ULTRON XPS Variant 4</option>
                    <option value="ultron+xps5.glb">ULTRON XPS Variant 5</option>
                    <option value="ultron_exported.glb">ULTRON Exported Model</option>
                    <option value="ultron_model.glb">ULTRON Standard Model</option>
                </select>
            </div>
            
            <button onclick="loadSelectedModel()">Load Model</button>
            <button onclick="toggleAnimation()">Toggle Animation</button>
            <button onclick="resetCamera()">Reset Camera</button>
            <button onclick="toggleWireframe()">Toggle Wireframe</button>
            
            <div class="info">
                <div><strong>Controls:</strong></div>
                <div>• Mouse: Rotate camera</div>
                <div>• Scroll: Zoom in/out</div>
                <div>• Right-click + drag: Pan</div>
                <div><strong>Status:</strong> <span id="status">Ready</span></div>
            </div>
        </div>
        
        <div id="loading" class="loading" style="display: none;">
            <div class="spinner"></div>
            <div>Loading ULTRON Model...</div>
        </div>
    </div>

    <script>
        let scene, camera, renderer, controls, currentModel;
        let animationId;
        let isAnimating = false;
        let wireframeMode = false;
        
        // Initialize Three.js scene
        function init() {
            // Scene
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x000000);
            
            // Camera
            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 2, 5);
            
            // Renderer
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;
            document.getElementById('container').appendChild(renderer.domElement);
            
            // Lighting
            const ambientLight = new THREE.AmbientLight(0x00ff41, 0.4);
            scene.add(ambientLight);
            
            const directionalLight = new THREE.DirectionalLight(0x00ff41, 0.8);
            directionalLight.position.set(5, 10, 5);
            directionalLight.castShadow = true;
            directionalLight.shadow.mapSize.width = 2048;
            directionalLight.shadow.mapSize.height = 2048;
            scene.add(directionalLight);
            
            const pointLight1 = new THREE.PointLight(0x0066ff, 0.6, 100);
            pointLight1.position.set(-5, 5, 5);
            scene.add(pointLight1);
            
            const pointLight2 = new THREE.PointLight(0xff0066, 0.6, 100);
            pointLight2.position.set(5, 5, -5);
            scene.add(pointLight2);
            
            // Controls (OrbitControls)
            if (typeof THREE.OrbitControls !== 'undefined') {
                controls = new THREE.OrbitControls(camera, renderer.domElement);
                controls.enableDamping = true;
                controls.dampingFactor = 0.05;
            } else {
                // Fallback mouse controls
                setupMouseControls();
            }
            
            // Grid
            const gridHelper = new THREE.GridHelper(10, 10, 0x00ff41, 0x003300);
            scene.add(gridHelper);
            
            // Load default model
            loadModel('ultron+xps.glb');
            
            // Start render loop
            animate();
            
            // Handle window resize
            window.addEventListener('resize', onWindowResize, false);
        }
        
        function setupMouseControls() {
            let isMouseDown = false;
            let mouseX = 0, mouseY = 0;
            
            renderer.domElement.addEventListener('mousedown', (event) => {
                isMouseDown = true;
                mouseX = event.clientX;
                mouseY = event.clientY;
            });
            
            renderer.domElement.addEventListener('mouseup', () => {
                isMouseDown = false;
            });
            
            renderer.domElement.addEventListener('mousemove', (event) => {
                if (!isMouseDown) return;
                
                const deltaX = event.clientX - mouseX;
                const deltaY = event.clientY - mouseY;
                
                // Rotate camera around the scene
                const spherical = new THREE.Spherical();
                spherical.setFromVector3(camera.position);
                spherical.theta -= deltaX * 0.01;
                spherical.phi += deltaY * 0.01;
                spherical.phi = Math.max(0.1, Math.min(Math.PI - 0.1, spherical.phi));
                
                camera.position.setFromSpherical(spherical);
                camera.lookAt(0, 0, 0);
                
                mouseX = event.clientX;
                mouseY = event.clientY;
            });
            
            renderer.domElement.addEventListener('wheel', (event) => {
                const scale = event.deltaY > 0 ? 1.1 : 0.9;
                camera.position.multiplyScalar(scale);
            });
        }
        
        function loadModel(modelName) {
            document.getElementById('loading').style.display = 'block';
            document.getElementById('status').textContent = 'Loading...';
            
            // Remove existing model
            if (currentModel) {
                scene.remove(currentModel);
            }
            
            const loader = new THREE.GLTFLoader();
            const modelPath = `../../../Avatar/${modelName}`;
            
            loader.load(
                modelPath,
                function (gltf) {
                    currentModel = gltf.scene;
                    
                    // Scale and position the model
                    currentModel.scale.set(1, 1, 1);
                    currentModel.position.set(0, 0, 0);
                    
                    // Enable shadows
                    currentModel.traverse(function (child) {
                        if (child.isMesh) {
                            child.castShadow = true;
                            child.receiveShadow = true;
                            
                            // Enhance materials with ULTRON glow
                            if (child.material) {
                                child.material.emissive = new THREE.Color(0x001100);
                                child.material.emissiveIntensity = 0.2;
                            }
                        }
                    });
                    
                    scene.add(currentModel);
                    
                    // Center camera on model
                    const box = new THREE.Box3().setFromObject(currentModel);
                    const center = box.getCenter(new THREE.Vector3());
                    const size = box.getSize(new THREE.Vector3());
                    
                    const maxDim = Math.max(size.x, size.y, size.z);
                    const fov = camera.fov * (Math.PI / 180);
                    let cameraZ = Math.abs(maxDim / 2 / Math.tan(fov / 2));
                    cameraZ *= 2; // Add some padding
                    
                    camera.position.set(center.x, center.y + size.y * 0.5, center.z + cameraZ);
                    camera.lookAt(center);
                    
                    if (controls) {
                        controls.target.copy(center);
                        controls.update();
                    }
                    
                    document.getElementById('loading').style.display = 'none';
                    document.getElementById('status').textContent = `Loaded: ${modelName}`;
                },
                function (progress) {
                    const percent = Math.round((progress.loaded / progress.total) * 100);
                    document.getElementById('status').textContent = `Loading... ${percent}%`;
                },
                function (error) {
                    console.error('Error loading model:', error);
                    document.getElementById('loading').style.display = 'none';
                    document.getElementById('status').textContent = `Error: ${modelName} not found`;
                    
                    // Create a fallback cube with ULTRON styling
                    createFallbackModel();
                }
            );
        }
        
        function createFallbackModel() {
            const geometry = new THREE.BoxGeometry(2, 3, 1);
            const material = new THREE.MeshPhongMaterial({
                color: 0x00ff41,
                emissive: 0x001100,
                emissiveIntensity: 0.3,
                shininess: 100
            });
            
            currentModel = new THREE.Mesh(geometry, material);
            currentModel.castShadow = true;
            currentModel.receiveShadow = true;
            scene.add(currentModel);
            
            document.getElementById('status').textContent = 'Fallback model loaded';
        }
        
        function loadSelectedModel() {
            const select = document.getElementById('modelSelect');
            const selectedModel = select.value;
            loadModel(selectedModel);
        }
        
        function toggleAnimation() {
            isAnimating = !isAnimating;
            document.getElementById('status').textContent = isAnimating ? 'Animation: ON' : 'Animation: OFF';
        }
        
        function resetCamera() {
            camera.position.set(0, 2, 5);
            camera.lookAt(0, 0, 0);
            if (controls) {
                controls.target.set(0, 0, 0);
                controls.update();
            }
            document.getElementById('status').textContent = 'Camera reset';
        }
        
        function toggleWireframe() {
            wireframeMode = !wireframeMode;
            
            if (currentModel) {
                currentModel.traverse(function (child) {
                    if (child.isMesh && child.material) {
                        child.material.wireframe = wireframeMode;
                    }
                });
            }
            
            document.getElementById('status').textContent = wireframeMode ? 'Wireframe: ON' : 'Wireframe: OFF';
        }
        
        function animate() {
            animationId = requestAnimationFrame(animate);
            
            // Rotate model if animation is enabled
            if (currentModel && isAnimating) {
                currentModel.rotation.y += 0.01;
            }
            
            // Update controls
            if (controls) {
                controls.update();
            }
            
            // Render
            renderer.render(scene, camera);
        }
        
        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }
        
        // Keyboard shortcuts
        document.addEventListener('keydown', (event) => {
            switch(event.code) {
                case 'Space':
                    event.preventDefault();
                    toggleAnimation();
                    break;
                case 'KeyR':
                    resetCamera();
                    break;
                case 'KeyW':
                    toggleWireframe();
                    break;
                case 'KeyL':
                    loadSelectedModel();
                    break;
            }
        });
        
        // Initialize when page loads
        window.addEventListener('load', init);
        
        // Load OrbitControls if available
        const script = document.createElement('script');
        script.src = 'https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js';
        script.onload = function() {
            if (controls) {
                controls.dispose();
            }
            controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.05;
        };
        document.head.appendChild(script);
    </script>
</body>
</html>
