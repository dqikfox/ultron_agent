name: gizmo
version: 1.0.28
schema: v1

models:
  # Anthropic Models
  - name: Claude 3.7 Sonnet
    provider: anthropic
    model: claude-3-7-sonnet-20240229
    apiKey: ${ANTHROPIC_API_KEY}
    roles:
      - chat
      - edit
      - apply

  - name: Claude 3.5 Sonnet
    provider: anthropic
    model: claude-3-5-sonnet-20241022
    apiKey: ${ANTHROPIC_API_KEY}
    roles:
      - chat
      - edit
      - apply

  # ULTRON Agent Models (port 11434)
  - name: ULTRON Development Assistant
    provider: ollama
    model: qwen3-coder:480b-cloud
    apiBase: http://localhost:11434
    roles:
      - chat
      - edit
      - apply

  - name: ULTRON Brain (Llava 7B)
    provider: ollama
    model: llava:7b
    apiBase: http://localhost:11434
    roles:
      - chat
      - edit
      - apply

context:
  - provider: diff
  - provider: codebase
  - provider: url
  - provider: folder
  - provider: terminal
  - provider: code
  - provider: file
  - provider: docs
    startUrl: "https://docs.continue.dev"
    maxDepth: 3

rules:
  - .continue/rules/project-architecture.md
  - .continue/rules/coding-standards.md

mcpServers:
  - name: github
    command: npx
    args: ["-y", "@anthropic-ai/mcp-server-github"]
    env:
      GITHUB_PERSONAL_ACCESS_TOKEN: ${GITHUB_PERSONAL_ACCESS_TOKEN}

  - name: filesystem
    command: npx
    args: ["-y", "@anthropic-ai/mcp-server-filesystem"]
    env:
      PATH: ${FILESYSTEM_PATH}

  - name: browser
    command: npx
    args: ["-y", "@anthropic-ai/mcp-server-browser"]
    env:
      BROWSER_HEADLESS: "false"

  - name: browsermcp
    command: npx
    args: ["@browsermcp/mcp@latest"]

  - name: deepwiki
    type: streamable-http
    url: https://mcp.deepwiki.com/mcp

  - name: langflow
    command: npx
    args: ["-y", "@langflow/mcp-server"]