name: gizmo
version: 1.0.28
schema: v1

models:
  # Anthropic Models
  - name: Claude 3.7 Sonnet
    provider: anthropic
    model: claude-3-7-sonnet-20240229
    apiKey: ${ANTHROPIC_API_KEY}
    roles:
      - chat
      - edit
      - apply

  - name: Claude 3.5 Sonnet
    provider: anthropic
    model: claude-3-5-sonnet-20241022
    apiKey: ${ANTHROPIC_API_KEY}
    roles:
      - chat
      - edit
      - apply

  - name: Claude 4 Sonnet
    provider: anthropic
    model: claude-4-sonnet
    apiKey: ${ANTHROPIC_API_KEY}
    roles:
      - chat
      - edit

  # Mistral Models
  - name: Codestral
    provider: mistral
    model: codestral-latest
    apiKey: ${MISTRAL_API_KEY}
    roles:
      - autocomplete

  # Voyage AI Models
  - name: Voyage Code 3
    provider: voyage
    model: voyage-code-3
    apiKey: ${VOYAGE_API_KEY}

  - name: Voyage Rerank 2
    provider: voyage
    model: rerank-2
    apiKey: ${VOYAGE_API_KEY}

  # XAI Models
  - name: Grok 4
    provider: openai
    model: grok-4
    apiBase: https://api.x.ai/v1
    apiKey: ${XAI_API_KEY}

  # Ollama Models (Local)
  - name: Qwen2.5 Coder 7B
    provider: ollama
    model: qwen2.5-coder:7b
    roles:
      - chat
      - autocomplete

  - name: Devstral
    provider: ollama
    model: devstral

  - name: Qwen3 30B
    provider: ollama
    model: qwen3:30b

  - name: Qwen2.5 Coder 1.5B
    provider: ollama
    model: qwen2.5-coder:1.5b
    roles:
      - autocomplete

  # Local Agent (ULTRON Agent Integration)
  - name: Local Agent
    provider: continue-proxy
    model: gpt-3.5-turbo
    apiBase: http://localhost:8000/v1
    apiKey: ultron-local-key
    orgScopeId: ultron-local
    onPremProxyUrl: http://localhost:8000
    roles:
      - chat
      - edit
      - apply

# Context Providers
context:
  - provider: diff
  - provider: codebase
  - provider: url
  - provider: folder
  - provider: terminal
  - provider: code
  - provider: file
  - provider: docs
  - provider: currentFile
  - provider: repoMap
  - provider: openFiles
  - provider: clipboard
  - provider: os
  - provider: commits
  - provider: problems

# MCP Servers
mcpServers:
  - name: github
    command: npx
    args: ["-y", "@anthropic-ai/mcp-server-github"]
    env:
      GITHUB_PERSONAL_ACCESS_TOKEN: ${GITHUB_PERSONAL_ACCESS_TOKEN}

  - name: postgres
    command: npx
    args: ["-y", "@anthropic-ai/mcp-server-postgres"]
    env:
      CONNECTION_STRING: ${POSTGRES_CONNECTION_STRING}

  - name: filesystem
    command: npx
    args: ["-y", "@anthropic-ai/mcp-server-filesystem"]
    env:
      PATH: ${FILESYSTEM_PATH}

  - name: playwright
    command: npx
    args: ["-y", "playwright-mcp-server"]

  - name: exa
    command: npx
    args: ["-y", "exa-mcp"]
    env:
      EXA_API_KEY: ${EXA_API_KEY}

  - name: brave-search
    command: npx
    args: ["-y", "@anthropic-ai/mcp-server-brave-search"]
    env:
      BRAVE_API_KEY: ${BRAVE_API_KEY}

  - name: memory
    command: npx
    args: ["-y", "@anthropic-ai/mcp-server-memory"]

  - name: Context7 MCP
    type: streamable-http
    url: https://mcp.context7.com/mcp


