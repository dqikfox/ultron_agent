<!DOCTYPE html>
<html>
<head>
    <title>ULTRON GUI API Test</title>
</head>
<body>
    <h1>ULTRON GUI API Test</h1>
    <div id="results"></div>
    <button onclick="testAPI()">Test /api/llm/chat</button>

    <script>
        async function testAPI() {
            const resultsDiv = document.getElementById('results');
            resultsDiv.innerHTML = '<p>Testing...</p>';

            // Log the current window location
            console.log('Window location:', window.location);
            console.log('Origin:', window.location.origin);

            try {
                const url = `${window.location.origin}/api/llm/chat`;
                console.log('Testing URL:', url);

                const response = await fetch(url, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: 'test' })
                });

                console.log('Response status:', response.status);
                console.log('Response ok:', response.ok);

                const data = await response.json();
                console.log('Response data:', data);

                resultsDiv.innerHTML = `
                    <h2>✅ Success!</h2>
                    <p><strong>URL:</strong> ${url}</p>
                    <p><strong>Status:</strong> ${response.status}</p>
                    <p><strong>Response:</strong> ${JSON.stringify(data, null, 2)}</p>
                `;
            } catch (error) {
                console.error('Error:', error);
                resultsDiv.innerHTML = `
                    <h2>❌ Failed!</h2>
                    <p><strong>Error:</strong> ${error.message}</p>
                    <p><strong>Stack:</strong> <pre>${error.stack}</pre></p>
                `;
            }
        }
    </script>
</body>
</html>
