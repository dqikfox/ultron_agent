<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ULTRON 3D Model Viewer</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Courier New', monospace;
            background: linear-gradient(135deg, #0a0a0a 0%, #1a1a2e 100%);
            overflow: hidden;
            color: #00ff41;
        }

        #canvas-3d {
            width: 100vw;
            height: 100vh;
            display: block;
        }

        .ui-overlay {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(0, 0, 0, 0.9);
            border: 2px solid #00ff41;
            border-radius: 10px;
            padding: 20px;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            box-shadow: 0 0 20px rgba(0, 255, 65, 0.3);
        }

        h1 {
            color: #00ff41;
            font-size: 24px;
            text-transform: uppercase;
            letter-spacing: 3px;
            text-shadow: 0 0 10px #00ff41;
            margin-bottom: 10px;
        }

        .subtitle {
            color: rgba(255, 255, 255, 0.8);
            font-size: 14px;
        }

        .controls {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(0, 0, 0, 0.9);
            border: 2px solid #00ff41;
            border-radius: 10px;
            padding: 20px;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            box-shadow: 0 0 20px rgba(0, 255, 65, 0.3);
            min-width: 220px;
        }

        .controls h2 {
            color: #00ff41;
            font-size: 16px;
            margin-bottom: 15px;
            text-align: center;
        }

        button {
            width: 100%;
            padding: 10px;
            margin: 5px 0;
            background: linear-gradient(135deg, #00ff41 0%, #00cc33 100%);
            border: none;
            border-radius: 5px;
            color: #000;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
            font-family: 'Courier New', monospace;
            font-size: 12px;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 255, 65, 0.5);
        }

        button:active {
            transform: translateY(0);
        }

        .loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #00ff41;
            font-size: 24px;
            text-align: center;
            z-index: 1000;
        }

        .spinner {
            border: 4px solid rgba(0, 255, 65, 0.1);
            border-top: 4px solid #00ff41;
            border-radius: 50%;
            width: 60px;
            height: 60px;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }

        .progress-bar {
            width: 200px;
            height: 10px;
            background: rgba(0, 255, 65, 0.1);
            border: 2px solid #00ff41;
            border-radius: 5px;
            margin: 20px auto;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #00ff41 0%, #00cc33 100%);
            width: 0%;
            transition: width 0.3s;
        }

        .instructions {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.9);
            border: 2px solid #00ff41;
            border-radius: 10px;
            padding: 15px 25px;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            box-shadow: 0 0 20px rgba(0, 255, 65, 0.3);
            color: #00ff41;
            font-size: 12px;
            text-align: center;
        }

        .stats {
            position: absolute;
            bottom: 20px;
            right: 20px;
            background: rgba(0, 0, 0, 0.9);
            border: 2px solid #00ff41;
            border-radius: 10px;
            padding: 10px;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            font-size: 11px;
            color: #00ff41;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .pulse { animation: pulse 2s ease-in-out infinite; }
    </style>
</head>
<body>
    <canvas id="canvas-3d"></canvas>

    <div class="loading" id="loading">
        <div class="spinner"></div>
        <p class="pulse">LOADING ULTRON MODEL...</p>
        <div class="progress-bar">
            <div class="progress-fill" id="progress"></div>
        </div>
        <p id="status" style="font-size: 14px; margin-top: 10px;">Initializing...</p>
    </div>

    <div class="ui-overlay" style="display:none;" id="title">
        <h1>🤖 ULTRON</h1>
        <p class="subtitle">3D Model Viewer</p>
    </div>

    <div class="controls" style="display:none;" id="controls">
        <h2>⚙️ CONTROLS</h2>
        <button onclick="viewer.toggleRotation()">⏯️ Auto-Rotate</button>
        <button onclick="viewer.toggleWireframe()">🔲 Wireframe</button>
        <button onclick="viewer.resetView()">📷 Reset View</button>
        <button onclick="viewer.cycleLight()">💡 Lighting</button>
        <button onclick="viewer.toggleGrid()">📐 Grid</button>
        <button onclick="viewer.cycleBackground()">🎨 Background</button>
    </div>

    <div class="instructions" style="display:none;" id="instructions">
        <strong>Mouse:</strong> Left=Rotate • Right=Pan • Scroll=Zoom
    </div>

    <div class="stats" id="stats" style="display:none;">
        <div>FPS: <span id="fps">60</span></div>
        <div>Vertices: <span id="vertices">0</span></div>
        <div>Faces: <span id="faces">0</span></div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

    <script>
        class UltronViewer {
            constructor() {
                this.scene = new THREE.Scene();
                this.scene.background = new THREE.Color(0x0a0a0a);
                this.scene.fog = new THREE.Fog(0x0a0a0a, 10, 50);

                this.camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
                this.camera.position.set(0, 2, 5);

                this.renderer = new THREE.WebGLRenderer({
                    canvas: document.getElementById('canvas-3d'),
                    antialias: true
                });
                this.renderer.setSize(window.innerWidth, window.innerHeight);
                this.renderer.setPixelRatio(window.devicePixelRatio);
                this.renderer.shadowMap.enabled = true;
                this.renderer.shadowMap.type = THREE.PCFSoftShadowMap;

                this.controls = new THREE.OrbitControls(this.camera, this.renderer.domElement);
                this.controls.enableDamping = true;
                this.controls.dampingFactor = 0.05;
                this.controls.minDistance = 2;
                this.controls.maxDistance = 20;

                this.model = null;
                this.isRotating = true;
                this.lightMode = 0;
                this.backgroundMode = 0;
                this.wireframeMode = false;

                // FPS tracking
                this.lastTime = performance.now();
                this.frames = 0;
                this.fps = 60;

                this.setupLights();
                this.addGrid();
                this.loadModel();

                window.addEventListener('resize', () => this.onResize());
                this.animate();
                this.updateStats();
            }

            setupLights() {
                // Stronger ambient light for better base visibility
                this.ambient = new THREE.AmbientLight(0xffffff, 0.7);
                this.scene.add(this.ambient);

                // Key light (main directional) - white for natural colors
                this.keyLight = new THREE.DirectionalLight(0xffffff, 1.5);
                this.keyLight.position.set(5, 10, 5);
                this.keyLight.castShadow = true;
                this.keyLight.shadow.mapSize.width = 2048;
                this.keyLight.shadow.mapSize.height = 2048;
                this.scene.add(this.keyLight);

                // Fill light (softer opposite side) - white
                this.fillLight = new THREE.DirectionalLight(0xffffff, 0.8);
                this.fillLight.position.set(-5, 5, -5);
                this.scene.add(this.fillLight);

                // Rim light (back highlight) - white
                this.rimLight = new THREE.DirectionalLight(0xffffff, 1.0);
                this.rimLight.position.set(0, 5, -10);
                this.scene.add(this.rimLight);

                // Point lights for fill
                this.pointLight1 = new THREE.PointLight(0xffffff, 1.2, 10);
                this.pointLight1.position.set(3, 3, 3);
                this.scene.add(this.pointLight1);

                this.pointLight2 = new THREE.PointLight(0xffffff, 1.0, 10);
                this.pointLight2.position.set(-3, 2, -3);
                this.scene.add(this.pointLight2);

                // Hemisphere light for natural ambient
                this.hemiLight = new THREE.HemisphereLight(0xffffff, 0x444444, 0.6);
                this.scene.add(this.hemiLight);
            }

            addGrid() {
                this.grid = new THREE.GridHelper(20, 20, 0x00ff41, 0x1a1a2e);
                this.grid.material.opacity = 0.3;
                this.grid.material.transparent = true;
                this.scene.add(this.grid);
            }

            loadModel() {
                const loader = new THREE.GLTFLoader();
                const progressBar = document.getElementById('progress');
                const statusText = document.getElementById('status');

                loader.load(
                    'ultron_model.glb',  // White ULTRON model

                    // On load success
                    (gltf) => {
                        console.log('✅ Model loaded successfully!');
                        this.model = gltf.scene;

                        // Calculate bounding box for auto-scaling
                        const box = new THREE.Box3().setFromObject(this.model);
                        const size = box.getSize(new THREE.Vector3());
                        const center = box.getCenter(new THREE.Vector3());

                        // Debug logging
                        console.log('Model size:', size);
                        console.log('Model center:', center);
                        console.log('Model has', this.model.children.length, 'children');

                        // Scale to fit in view (target size ~4 units for better visibility)
                        const maxDim = Math.max(size.x, size.y, size.z);
                        const scale = 4 / maxDim;
                        this.model.scale.multiplyScalar(scale);

                        // Center the model at origin
                        this.model.position.set(0, 0, 0);
                        this.model.position.sub(center.multiplyScalar(scale));

                        // Adjust camera to better view the model
                        // Position camera farther back to see full model (y-axis is tall: 3691 units)
                        this.camera.position.set(0, 2, 15);  // Moved from z:8 to z:15 for full view
                        this.camera.lookAt(0, 2, 0);  // Look at center of scaled model
                        this.controls.target.set(0, 2, 0);
                        this.controls.update();

                        // Enhanced material handling
                        this.model.traverse((child) => {
                            if (child.isMesh) {
                                console.log('Found mesh:', child.name, 'visible:', child.visible);

                                if (child.material) {
                                    // Clone material to avoid modifying shared materials
                                    child.material = child.material.clone();

                                    // Ensure solid rendering
                                    child.material.transparent = false;
                                    child.material.opacity = 1.0;
                                    child.material.side = THREE.DoubleSide;
                                    child.material.depthWrite = true;
                                    child.material.depthTest = true;

                                    // If no texture/color, apply a default material
                                    if (!child.material.map && !child.material.color) {
                                        child.material.color = new THREE.Color(0xcccccc);
                                    }

                                    // Enhance material properties for better visibility
                                    child.material.metalness = child.material.metalness || 0.3;
                                    child.material.roughness = child.material.roughness || 0.7;

                                    // Add subtle emissive if model is too dark
                                    if (!child.material.emissive || child.material.emissive.getHex() === 0) {
                                        child.material.emissive = new THREE.Color(0x222222);
                                        child.material.emissiveIntensity = 0.2;
                                    }
                                }
                                child.castShadow = true;
                                child.receiveShadow = true;
                                child.visible = true; // Force visible
                            }
                        });

                        this.scene.add(this.model);
                        console.log('Model added to scene');

                        // Calculate stats
                        let vertices = 0, faces = 0;
                        this.model.traverse((child) => {
                            if (child.isMesh && child.geometry) {
                                vertices += child.geometry.attributes.position.count;
                                if (child.geometry.index) {
                                    faces += child.geometry.index.count / 3;
                                }
                            }
                        });

                        document.getElementById('vertices').textContent = vertices.toLocaleString();
                        document.getElementById('faces').textContent = Math.floor(faces).toLocaleString();

                        // Hide loading, show UI
                        document.getElementById('loading').style.display = 'none';
                        document.getElementById('title').style.display = 'block';
                        document.getElementById('controls').style.display = 'block';
                        document.getElementById('instructions').style.display = 'block';
                        document.getElementById('stats').style.display = 'block';

                        // Play animations if available
                        if (gltf.animations && gltf.animations.length > 0) {
                            this.mixer = new THREE.AnimationMixer(this.model);
                            gltf.animations.forEach((clip) => {
                                this.mixer.clipAction(clip).play();
                            });
                        }
                    },

                    // On progress
                    (xhr) => {
                        const percentComplete = (xhr.loaded / xhr.total) * 100;
                        progressBar.style.width = percentComplete + '%';
                        statusText.textContent = `Loading... ${Math.round(percentComplete)}%`;
                        console.log(`Loading: ${Math.round(percentComplete)}%`);
                    },

                    // On error
                    (error) => {
                        console.error('❌ Error loading ULTRON model:', error);
                        statusText.innerHTML = `
                            <span style="color: #ff4444;">⚠️ MODEL NOT FOUND</span><br>
                            <span style="font-size: 12px; color: #fff;">
                                Please export ultron+xps.blend as ultron_model.glb<br>
                                See BLENDER_GUIDE.md for instructions
                            </span>
                        `;
                    }
                );
            }

            toggleRotation() {
                this.isRotating = !this.isRotating;
            }

            toggleWireframe() {
                this.wireframeMode = !this.wireframeMode;
                if (this.model) {
                    this.model.traverse((child) => {
                        if (child.isMesh && child.material) {
                            child.material.wireframe = this.wireframeMode;
                        }
                    });
                }
            }

            toggleGrid() {
                this.grid.visible = !this.grid.visible;
            }

            cycleBackground() {
                const backgrounds = [
                    0x0a0a0a, // Dark
                    0x1a1a2e, // Navy
                    0x000000, // Black
                    0x0f3460  // Blue
                ];
                this.backgroundMode = (this.backgroundMode + 1) % backgrounds.length;
                this.scene.background = new THREE.Color(backgrounds[this.backgroundMode]);
            }

            cycleLight() {
                this.lightMode = (this.lightMode + 1) % 3;

                switch(this.lightMode) {
                    case 0: // Green theme
                        this.keyLight.color.setHex(0x00ff41);
                        this.fillLight.color.setHex(0x4169e1);
                        this.rimLight.color.setHex(0x00ffff);
                        break;
                    case 1: // Blue theme
                        this.keyLight.color.setHex(0x00aaff);
                        this.fillLight.color.setHex(0x0044aa);
                        this.rimLight.color.setHex(0x00ffff);
                        break;
                    case 2: // Red alert theme
                        this.keyLight.color.setHex(0xff0044);
                        this.fillLight.color.setHex(0xaa0022);
                        this.rimLight.color.setHex(0xff4444);
                        break;
                }
            }

            resetView() {
                this.camera.position.set(0, 2, 5);
                this.controls.target.set(0, 0, 0);
                this.controls.update();
            }

            onResize() {
                this.camera.aspect = window.innerWidth / window.innerHeight;
                this.camera.updateProjectionMatrix();
                this.renderer.setSize(window.innerWidth, window.innerHeight);
            }

            updateStats() {
                setInterval(() => {
                    document.getElementById('fps').textContent = Math.round(this.fps);
                }, 1000);
            }

            animate() {
                requestAnimationFrame(() => this.animate());

                // FPS calculation
                const currentTime = performance.now();
                this.frames++;
                if (currentTime >= this.lastTime + 1000) {
                    this.fps = (this.frames * 1000) / (currentTime - this.lastTime);
                    this.frames = 0;
                    this.lastTime = currentTime;
                }

                // Auto-rotation
                if (this.model && this.isRotating) {
                    this.model.rotation.y += 0.005;
                }

                // Animate lights
                const time = Date.now() * 0.001;
                this.pointLight1.position.x = Math.sin(time) * 3;
                this.pointLight1.position.z = Math.cos(time) * 3;
                this.pointLight2.position.x = Math.cos(time * 1.3) * 3;
                this.pointLight2.position.z = Math.sin(time * 1.3) * 3;

                // Update animation mixer
                if (this.mixer) {
                    this.mixer.update(0.016);
                }

                this.controls.update();
                this.renderer.render(this.scene, this.camera);
            }
        }

        // Initialize viewer
        const viewer = new UltronViewer();

        console.log(`
╔══════════════════════════════════════════════════════╗
║         ULTRON 3D MODEL VIEWER v1.0                  ║
║                                                      ║
║  Ready to load: ultron_model.glb                     ║
║                                                      ║
║  Export Instructions:                                ║
║  1. Open ultron+xps.blend in Blender                 ║
║  2. File > Export > glTF 2.0 (.glb)                  ║
║  3. Save as "ultron_model.glb" in Avatar folder      ║
║  4. Refresh this page                                ║
╚══════════════════════════════════════════════════════╝
        `);
    </script>
</body>
</html>
