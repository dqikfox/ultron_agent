<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Shadow Crystal - D&D 3.5 Adventure</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Cinzel', serif;
            background: #0a0a0a url('data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><rect fill="%23000" width="100" height="100"/><circle cx="50" cy="50" r="40" fill="%23111" opacity="0.3"/></svg>');
            color: #ffd700;
            overflow: hidden;
        }
        #game-container {
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }
        #scene-view {
            flex: 1;
            position: relative;
            background: linear-gradient(180deg, #1a1a2e 0%, #0f0f1e 100%);
            border: 3px solid #ffd700;
            overflow: hidden;
        }
        #scene-image {
            width: 100%;
            height: 100%;
            object-fit: cover;
            opacity: 0.7;
        }
        #character-avatar {
            position: absolute;
            bottom: 20%;
            left: 50%;
            transform: translateX(-50%);
            width: 150px;
            height: 150px;
            background: radial-gradient(circle, #8b4513, #654321);
            border-radius: 50%;
            border: 4px solid #ffd700;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 80px;
            cursor: pointer;
            transition: transform 0.3s;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
        }
        #character-avatar:hover { transform: translateX(-50%) scale(1.1); }
        #ui-panel {
            height: 300px;
            background: rgba(0,0,0,0.95);
            border-top: 3px solid #ffd700;
            display: flex;
            gap: 20px;
            padding: 20px;
        }
        #dialogue-box {
            flex: 2;
            background: rgba(26,26,46,0.9);
            border: 2px solid #ffd700;
            border-radius: 10px;
            padding: 15px;
            overflow-y: auto;
        }
        #stats-panel {
            flex: 1;
            background: rgba(26,26,46,0.9);
            border: 2px solid #ffd700;
            border-radius: 10px;
            padding: 15px;
        }
        .dialogue-line {
            margin-bottom: 10px;
            padding: 8px;
            background: rgba(0,0,0,0.5);
            border-left: 3px solid #ffd700;
            border-radius: 4px;
        }
        .npc-name { color: #ff6b6b; font-weight: bold; }
        .player-name { color: #4ecdc4; font-weight: bold; }
        #dice-container {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 200px;
            height: 200px;
            perspective: 1000px;
            display: none;
        }
        #dice {
            width: 100%;
            height: 100%;
            position: relative;
            transform-style: preserve-3d;
            animation: rollDice 1s ease-out;
        }
        @keyframes rollDice {
            0% { transform: rotateX(0deg) rotateY(0deg); }
            100% { transform: rotateX(720deg) rotateY(720deg); }
        }
        .dice-face {
            position: absolute;
            width: 100px;
            height: 100px;
            background: linear-gradient(135deg, #ffd700, #ffed4e);
            border: 3px solid #8b4513;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 48px;
            font-weight: bold;
            color: #8b4513;
            border-radius: 10px;
            box-shadow: 0 0 20px rgba(255,215,0,0.8);
        }
        button {
            background: linear-gradient(135deg, #8b4513, #654321);
            color: #ffd700;
            border: 2px solid #ffd700;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-family: 'Cinzel', serif;
            font-weight: bold;
            transition: all 0.3s;
        }
        button:hover {
            background: linear-gradient(135deg, #654321, #8b4513);
            box-shadow: 0 0 20px rgba(255,215,0,0.6);
            transform: translateY(-2px);
        }
        .stat-item {
            margin: 8px 0;
            padding: 8px;
            background: rgba(0,0,0,0.5);
            border-radius: 4px;
        }
        .stat-label { color: #95e1d3; font-weight: bold; }
        .stat-value { color: #fff; float: right; }
        #action-buttons {
            display: flex;
            gap: 10px;
            margin-top: 10px;
        }
        .quest-stage {
            background: rgba(255,215,0,0.1);
            border: 1px solid #ffd700;
            padding: 10px;
            margin: 10px 0;
            border-radius: 8px;
        }
        .stage-complete { opacity: 0.5; text-decoration: line-through; }
    </style>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>
    <div id="game-container">
        <div id="scene-view">
            <img id="scene-image" src="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 800 600'><rect fill='%231a1a2e' width='800' height='600'/><text x='400' y='300' font-size='48' fill='%23ffd700' text-anchor='middle'>🏰 TAVERN</text></svg>" alt="Scene">
            <div id="character-avatar">🧙</div>
        </div>
        
        <div id="ui-panel">
            <div id="dialogue-box">
                <div class="dialogue-line">
                    <span class="npc-name">System:</span> Welcome to The Shadow Crystal! Click the NPC or press SPACE to begin.
                </div>
            </div>
            
            <div id="stats-panel">
                <h3 style="text-align: center; margin-bottom: 15px;">⚔️ CHARACTER</h3>
                <div class="stat-item">
                    <span class="stat-label">Class:</span>
                    <span class="stat-value" id="char-class">Fighter</span>
                </div>
                <div class="stat-item">
                    <span class="stat-label">Level:</span>
                    <span class="stat-value" id="char-level">1</span>
                </div>
                <div class="stat-item">
                    <span class="stat-label">HP:</span>
                    <span class="stat-value" id="char-hp">100/100</span>
                </div>
                <div class="stat-item">
                    <span class="stat-label">XP:</span>
                    <span class="stat-value" id="char-xp">0</span>
                </div>
                <div class="stat-item">
                    <span class="stat-label">Stage:</span>
                    <span class="stat-value" id="quest-stage">1/6</span>
                </div>
                <div id="action-buttons">
                    <button onclick="talkToNPC()">💬 Talk</button>
                    <button onclick="rollDice()">🎲 Roll</button>
                    <button onclick="nextStage()">➡️ Next</button>
                </div>
            </div>
        </div>
    </div>
    
    <div id="dice-container">
        <div id="dice">
            <div class="dice-face">20</div>
        </div>
    </div>

    <script>
        const OLLAMA_URL = 'http://localhost:11434/api/generate';
        const MODEL = 'llama3.1:latest';
        
        const gameState = {
            stage: 0,
            xp: 0,
            level: 1,
            hp: 100,
            maxHp: 100,
            class: 'Fighter',
            inventory: []
        };
        
        const questStages = [
            {name: 'Tavern', npc: 'Thamior the Innkeeper', emoji: '🏰', task: 'Gather information', dc: 10},
            {name: 'Market', npc: 'Mira the Merchant', emoji: '🏪', task: 'Buy supplies', dc: 12},
            {name: 'City Gate', npc: 'Captain Thorne', emoji: '🚪', task: 'Get travel permit', dc: 14},
            {name: 'Dark Forest', npc: 'Eldrin the Wizard', emoji: '🌲', task: 'Learn protection spell', dc: 16},
            {name: 'Cursed Caverns', npc: 'Stone Guardian', emoji: '⛰️', task: 'Defeat guardian', dc: 18},
            {name: 'Crystal Chamber', npc: 'Dark Wizard Malachar', emoji: '💎', task: 'Retrieve Shadow Crystal', dc: 20}
        ];
        
        function addDialogue(speaker, message, isPlayer = false) {
            const box = document.getElementById('dialogue-box');
            const line = document.createElement('div');
            line.className = 'dialogue-line';
            line.innerHTML = `<span class="${isPlayer ? 'player-name' : 'npc-name'}">${speaker}:</span> ${message}`;
            box.appendChild(line);
            box.scrollTop = box.scrollHeight;
        }
        
        async function talkToNPC() {
            const stage = questStages[gameState.stage];
            addDialogue('You', `Hello, ${stage.npc}. I need your help.`, true);
            
            const prompt = `You are ${stage.npc} in a D&D adventure. Location: ${stage.name}. The hero needs to: ${stage.task}. Respond in character with 2-3 sentences. Be helpful but add personality.`;
            
            try {
                const response = await fetch(OLLAMA_URL, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({
                        model: MODEL,
                        prompt: prompt,
                        stream: false
                    })
                });
                
                const data = await response.json();
                const npcResponse = data.response || "I can help you with that task.";
                addDialogue(stage.npc, npcResponse);
                
            } catch (error) {
                addDialogue(stage.npc, `*nods* You must ${stage.task}. Roll the dice to attempt it!`);
            }
        }
        
        function rollDice() {
            const container = document.getElementById('dice-container');
            const dice = document.getElementById('dice');
            const face = dice.querySelector('.dice-face');
            
            container.style.display = 'block';
            dice.style.animation = 'none';
            setTimeout(() => dice.style.animation = 'rollDice 1s ease-out', 10);
            
            setTimeout(() => {
                const roll = Math.floor(Math.random() * 20) + 1;
                face.textContent = roll;
                
                setTimeout(() => {
                    container.style.display = 'none';
                    checkRoll(roll);
                }, 1000);
            }, 1000);
        }
        
        function checkRoll(roll) {
            const stage = questStages[gameState.stage];
            const success = roll >= stage.dc;
            
            addDialogue('System', `🎲 You rolled ${roll} vs DC ${stage.dc}`);
            
            if (success) {
                addDialogue('System', `✅ Success! ${stage.task} completed.`);
                gameState.xp += 100;
                document.getElementById('char-xp').textContent = gameState.xp;
                
                if (gameState.xp >= gameState.level * 100) {
                    gameState.level++;
                    gameState.maxHp += 10;
                    gameState.hp = gameState.maxHp;
                    document.getElementById('char-level').textContent = gameState.level;
                    addDialogue('System', `🎉 Level Up! You are now level ${gameState.level}!`);
                }
            } else {
                addDialogue('System', `❌ Failed! Try again or talk to the NPC for hints.`);
            }
        }
        
        function nextStage() {
            if (gameState.stage < questStages.length - 1) {
                gameState.stage++;
                const stage = questStages[gameState.stage];
                
                document.getElementById('quest-stage').textContent = `${gameState.stage + 1}/6`;
                document.getElementById('scene-image').src = `data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 800 600'><rect fill='%231a1a2e' width='800' height='600'/><text x='400' y='300' font-size='48' fill='%23ffd700' text-anchor='middle'>${stage.emoji} ${stage.name.toUpperCase()}</text></svg>`;
                
                addDialogue('System', `📍 Arrived at ${stage.name}`);
                addDialogue('System', `🎯 Objective: ${stage.task}`);
            } else {
                addDialogue('System', `🎉 QUEST COMPLETE! You retrieved the Shadow Crystal and saved the land!`);
                addDialogue('System', `🏆 Final XP: ${gameState.xp} | Level: ${gameState.level}`);
            }
        }
        
        document.addEventListener('keydown', (e) => {
            if (e.code === 'Space') { e.preventDefault(); talkToNPC(); }
            else if (e.code === 'KeyR') rollDice();
            else if (e.code === 'KeyN') nextStage();
        });
        
        document.getElementById('character-avatar').onclick = talkToNPC;
        
        addDialogue('System', '🗡️ THE SHADOW CRYSTAL - D&D 3.5 Adventure');
        addDialogue('System', '⌨️ Controls: SPACE=Talk | R=Roll | N=Next Stage');
    </script>
</body>
</html>
