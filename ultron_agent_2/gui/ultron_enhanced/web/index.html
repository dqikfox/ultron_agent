  <script>
    const { createClient } = supabase;
    const supabaseUrl = 'https://YOUR_PROJECT.supabase.co';
    const supabaseKey = 'YOUR_PUBLIC_ANON_KEY';
    const supabaseClient = createClient(supabaseUrl, supabaseKey);

    const ELEVEN_API_KEY = 'YOUR_ELEVENLABS_API_KEY';
    const OLLAMA_URL = 'http://localhost:11434/api/chat';
    let mediaRecorder;
    let audioChunks = [];

    async function startRecording() {
      const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      audioChunks = [];
      mediaRecorder = new MediaRecorder(stream);
      mediaRecorder.ondataavailable = e => audioChunks.push(e.data);
      mediaRecorder.onstop = () => handleAudio(new Blob(audioChunks, { type: 'audio/webm' }));
      mediaRecorder.start();
    }

    function stopRecording() {
      if (mediaRecorder && mediaRecorder.state !== 'inactive') {
        mediaRecorder.stop();
      }
    }

    async function handleAudio(blob) {
      const text = await transcribeAudio(blob);
      appendMessage('user', text);
      const reply = await chatWithOllama(text);
      appendMessage('assistant', reply);
      await speak(reply);
      await logChat(text, reply);
    }

    async function transcribeAudio(blob) {
      const formData = new FormData();
      formData.append('audio', blob, 'input.webm');
      const resp = await fetch('https://api.elevenlabs.io/v1/speech-to-text', {
        method: 'POST',
        headers: { 'xi-api-key': ELEVEN_API_KEY },
        body: formData
      });
      const data = await resp.json();
      return data.text;
    }

    async function chatWithOllama(text) {
      const resp = await fetch(OLLAMA_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          model: 'llama3',
          messages: [{ role: 'user', content: text }]
        })
      });
      const data = await resp.json();
      return data.message.content;
    }

    async function speak(text) {
      const resp = await fetch('https://api.elevenlabs.io/v1/text-to-speech', {
        method: 'POST',
        headers: {
          'xi-api-key': ELEVEN_API_KEY,
          'Content-Type': 'application/json'
        },
        body: JSON.stringify({ text })
      });
      const buffer = await resp.arrayBuffer();
      const audio = new Audio(URL.createObjectURL(new Blob([buffer])));
      await audio.play();
    }

    async function logChat(userText, botText) {
      await supabaseClient.from('messages').insert({ user_text: userText, bot_text: botText });
    }

      div.className = role;
      div.textContent = `${role}: ${text}`;
      document.getElementById('conversation').appendChild(div);
    }

    micButton.addEventListener('mousedown', startRecording);
    micButton.addEventListener('mouseup', stopRecording);
